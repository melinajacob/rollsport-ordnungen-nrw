<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80">
  <g fill="none" stroke="#1e1e1e" stroke-width="1.5">
    <circle cx="50" cy="40" r="35"/>
    <circle cx="130" cy="40" r="35"/>
    <circle cx="210" cy="40" r="35"/>
    <!-- Wende marks: bracket-shaped curves at intersections -->
    <!-- First intersection: outward bracket on right side -->
    <path d="M 90,18 Q 98,28 90,40 Q 98,52 90,62"/>
    <!-- Second intersection: outward bracket on left side -->
    <path d="M 170,18 Q 162,28 170,40 Q 162,52 170,62"/>
  </g>
</svg>
