  - titel: Formationsrichtlinien
    id: formationen
    kopfzeile: Formationsrichtlinien
    neue_seite: true
    bloecke:
      - typ: startbedingungen
        klasse: "Schülerformation"
        alter: "8–15 Jahre"
        voraussetzung: "Prüfung A2"
        programm: |
          - **Anzahl Läufer:** 8–16
          - **Kürlaufzeit:** 03:30 – 04:00
          - **Gesang:** Ja
          - **Sprünge:** Max. 1/2 Umdrehung
          - **Hebungen:** Nicht erlaubt

      - typ: startbedingungen
        klasse: "Juniorenformation"
        alter: "8–18 Jahre"
        voraussetzung: "Prüfung A3"
        programm: |
          - **Anzahl Läufer:** 12–16
          - **Kürlaufzeit:** 04:00 ± 10 Sek.
          - **Gesang:** Ja
          - **Hebungen:** Nicht erlaubt

      - typ: startbedingungen
        klasse: "Meisterklasse Formation"
        alter: "Mindestalter 12"
        voraussetzung: "Prüfung Kür oder Pflicht 4"
        programm: |
          - **Anzahl Läufer:** 12–16
          - **Kürlaufzeit:** 04:30 – 05:00
          - **Gesang:** Ja
          - **Choreografischer Stop:** Max. 10 Sek. erlaubt

      - typ: abschnitt
        titel: "Kleiderordnung Formation"
        inhalt: |
          Spezifische Kleiderordnung für Formationen gemäß den Formationsrichtlinien.

      - typ: abschnitt
        titel: "Bewertung Formation"
        neue_seite: true
        inhalt: |
          **A-Note (Technik):** 1,0 – 10,0

          **B-Note (Harmonie):** A-Note ± 1,5

          **Bewertete Elemente:**

          | Element | Kürzel |
          |---------|--------|
          | Kreise | K1–K4 |
          | Mühlen | M1–M4 |
          | Blöcke | B1–B4 |
          | Kreuzungen | KG1–KG4 |
          | Linien | L1–L4 |
          | Schritte | S1–S4 |
          | Handhaltungen | H1–H4 |

      - typ: abschnitt
        titel: "Abzüge Formation"
        inhalt: |
          | Abzugsgrund | Abzug |
          |------------|-------|
          | Sturz (leicht) | -0,2 |
          | Sturz (schwer) | -1,0 |
          | Programmaufbau | variabel |

      - typ: abschnitt
        titel: "Programmaufbau"
        inhalt: |
          7 Regeln für die Komposition:

          1. Ausgewogene Verteilung der Elemente
          2. Nutzung der gesamten Lauffläche
          3. Vielfalt der Formationen
          4. Übergänge zwischen den Formationen
          5. Synchronität der Gruppe
          6. Ausdruck und Musikinterpretation
          7. Schwierigkeitsgrad angemessen zur Klasse

  - titel: Begriffserläuterungen
    id: begriffe
    kopfzeile: Begriffserläuterungen
    neue_seite: true
    bloecke:
      - typ: abschnitt
        titel: "Schrittfolge"
        inhalt: |
          Eine festgelegte Abfolge von Schritten und Drehungen, die in einer bestimmten Form
          (Kreis, Diagonal, Serpentine oder Längs) ausgeführt wird.

      - typ: abschnitt
        titel: "Choreo-Step Sequenz"
        inhalt: |
          Eine choreografische Schrittfolge, die Elemente wie Drehungen, Body Movements
          und Schritte verbindet und als Einheit bewertet wird.

      - typ: abschnitt
        titel: "3-Quadrantenregel"
        inhalt: |
          Die Schrittfolge muss mindestens 3 der 4 Quadranten der Lauffläche abdecken.

      - typ: abschnitt
        titel: "Start- und Stop-Position"
        inhalt: |
          Definierte Positionen zu Beginn und am Ende eines Kürlaufs.

      - typ: abschnitt
        titel: "Figurenserpentine"
        inhalt: |
          Eine Schrittfolge in Serpentinenform über die Lauffläche.

      - typ: abschnitt
        titel: "Merkmale eines Gruppenlaufs"
        neue_seite: true
        inhalt: |
          **Technik:**
          - Synchrone Ausführung der Elemente
          - Gleichmäßige Abstände zwischen den Läufern

          **Choreografie:**
          - Gemeinsame Gestaltung des Programms
          - Interaktion der Läufer untereinander

          **Wertung:**
          - A-Note für technische Ausführung
          - B-Note für künstlerische Gestaltung

      - typ: abschnitt
        titel: "Pirouetten – Bewertungskriterien"
        inhalt: |
          **Anlauf:** Vorbereitung der Pirouette

          **Eingang:** Übergang in die Drehung

          **Zentrierung:** Stabilität des Drehpunkts

          **Kante:** Korrekte Kantenführung

          **Umdrehungen:** Anzahl der vollständigen Drehungen

          **Wechsel:** Übergang zwischen Positionen

          **Position:** Haltung während der Drehung

          **Auslauf:** Kontrolle nach der Pirouette

  - titel: Anfänger Kürpokal
    id: kuerpokall
    kopfzeile: Anfänger Kürpokal
    neue_seite: true
    bloecke:
      - typ: abschnitt
        titel: "Anfänger Kürpokal"
        inhalt: |
          Der Anfänger Kürpokal richtet sich an Anfänger 1 und Anfänger 2, aufgeteilt
          nach Altersgruppen.

          | | |
          |---|---|
          | Kürlaufzeit | 01:30 – 02:00 |
          | Einlaufzeit | 02:30 |
          | Prüfungen | Keine erforderlich |

      - typ: hinweis
        inhalt: |
          Am Anfänger Kürpokal dürfen nur Läufer:innen teilnehmen, die **nicht**
          an der Landesmeisterschaft oder am A0-Sonderwettbewerb gemeldet sind.

