          - "Standpirouetten (3 Umdrehungen)"
          - "Sitzpirouetten (2 Umdrehungen)"
          - "Choreo-Step + 4 Schrittelemente"
        pruefung: |
          **Untersagt:** Axel, Waagepirouetten

          | | |
          |---|---|
          | Prüfung | A2 |
          | Musiklänge | 01:30 – 02:00 |
          | Gesang | Nein |
          | Abzüge | 0,5 pro nicht-erlaubtem Element |

      - typ: vorgabe
        name: "Fortgeschrittene 1"
        regeln:
          - "Axel (3/4)"
          - "Stand-/Sitzpirouetten (3 Umdrehungen)"
          - "Waagepirouetten va/ra (2 Umdrehungen, Kombination)"
          - "Schrittfolge nach 3-Quadrantenregel"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | A3 |
          | Musiklänge | 02:00 – 02:30 |
          | Gesang | Nein |
          | Abzüge | 0,5 pro nicht-erlaubtem Element |

      - typ: vorgabe
        name: "Fortgeschrittene 2"
        regeln:
          - "1 Doppelsprung erlaubt"
          - "Waagepirouetten va/ra"
          - "Schrittfolge"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | A3 |
          | Musiklänge | 02:00 – 02:30 |
          | Gesang | Ja |
          | Abzüge | 0,5 pro nicht-erlaubtem Element |

      - typ: vorgabe
        name: "Nachwuchsklasse"
        neue_seite: true
        regeln:
          - "Alle einfachen und Doppelsprünge + Axel"
          - "Alle Pirouetten (3 Umdrehungen) + Kombinationen"
          - "Schrittfolge"
          - "Beschränkung: 1 Sprung auf vorwärts"
          - "Toeloop-Beschränkung"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | Kür 3 |
          | Musiklänge | 03:00 ± 10 Sek. |
          | Gesang | Ja |
          | Abzüge | 0,5 pro Regelverstoß |

      - typ: vorgabe
        name: "Juniorenklasse"
        regeln:
          - "Alle einfachen und Doppelsprünge + Axel"
          - "Alle Pirouetten + Kombinationen"
          - "Toeloop-Beschränkung"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | Kür 3 |
          | Musiklänge | 03:30 ± 10 Sek. |
          | Gesang | Ja |
          | Abzüge | 0,5 pro Regelverstoß |

      - typ: vorgabe
        name: "Meisterklasse"
        regeln:
          - "Alle einfachen Sprünge + Axel"
          - "Doppel-Toeloop, Doppel-Salchow + 1 weiterer Doppelsprung"
          - "Pirouetten Kategorie B"
          - "Zusätzlich eine aus: Hacke va/ra, Inverted, Broken Ankle, Biellmann, Bryant, Biellmann Hacke"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | Kür 3 |
          | Musiklänge | 03:30 ± 10 Sek. |
          | Gesang | Ja |
          | Abzüge | 0,5 pro Regelverstoß |

      - typ: vorgabe
        name: "Meisterklasse Elite"
        regeln:
          - "Alles erlaubt"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | Kür 3 |
          | Musiklänge | 04:00 ± 10 Sek. |
          | Gesang | Ja |

      - typ: abschnitt
        titel: "Zweier-/Paar-/Gruppenlauf"
        neue_seite: true
        inhalt: |
          **A1:** Analog Einzellauf A1. Keine Prüfung. 02:00. Kein Gesang.

          **A2:** Analog Einzellauf A2. Keine Prüfung. 02:00. Kein Gesang.

          **Fortgeschrittene:** Analog Fortgeschrittene 1. Keine Prüfung. 02:00 – 02:30. Kein Gesang.

          **Nachwuchsklasse:** Wie Einzellauf NWK. Max. 4 Einzelsprünge, 2 Sprungkombinationen. Prüfung Kür 4. 03:30 ± 10 Sek. Gesang ja.

          **Juniorenklasse:** Max. 4 Einzelsprünge, 2 Doppelsprünge, 2 Sprungkombinationen. Prüfung Kür 4. 03:30 ± 10 Sek. Gesang ja.

          **Meisterklasse:** Wie Einzellauf MK. Prüfung Kür 3. 04:00 ± 10 Sek. Gesang ja.

