          - "Beschränkung: Max. 4 Einzelsprünge, davon max. 2 Doppelsprünge, zusätzlich 2 Sprungkombinationen erlaubt"
          - "Beschränkung: Toeloop als Einzelsprung, Verbindungssprung oder letzter Sprung in Kombination untersagt"
        pruefung: |
