titel: Meisterschaftsordnung
untertitel: "Wettkampfordnung / Meisterschaftsordnung Nordrhein-Westfalen"
unterzeile: "mit Wertungsrichtlinien für Wertungsrichter:innen"
saison: "2026"
stand: "02.03.2026"
stand_wr: "16.04.24"
stand_formation: "03.06.24"
kapitel:
  - titel: Regelungen Meisterschaften
    id: regelungen
    kopfzeile: Regelungen
    bloecke:
      - typ: abschnitt
        titel: "Neuerungen von Saison 2025 zu 2026"
        kopfzeile: "Neuerungen von Saison 2025 zu 2026"
        neue_seite: true
        inhalt: ""

      - typ: abschnitt
        kasten: rosa
        titel: "Trennung der Wettbewerbe Fortgeschrittene 1"
        inhalt: |
          Die Fortgeschrittene 1 Klasse wird ab der Saison 2026 in Pflicht und Kür als
          getrennte Wettbewerbe auf den Landesmeisterschaften behandelt.

      - typ: abschnitt
        kasten: rosa
        titel: "Sonderwettbewerb Anfänger 0"
        inhalt: |
          Im Einzellaufen wird eine neue Kategorie A0 als Sonderwettbewerb auf der
          Landesmeisterschaft eingeführt. Jeder Verein darf 5 Läufer/innen melden. A0 ist von
          den anderen Wettbewerben unabhängig. Läufer/innen in A0 können weiterhin am
          Pokalwettbewerb teilnehmen. Aus A0 kann nicht aufgestiegen werden. Der Verein
          kann in jedem Jahr neu entscheiden, ob ein/e Läufer/in in A0 oder A1 an den Start
          geht.

      - typ: abschnitt
        kasten: rosa
        titel: "Änderungen Anforderungen Einzellauf Kür Meisterklasse"
        inhalt: |
          Im Einzellauf der Meisterklasse wurde die Auswahl der zusätzlich erlaubten
          Pirouetten der Kategorie A erweitert durch: Biellmann, Bryant und Biellmann Hacke

      - typ: abschnitt
        kasten: rosa
        titel: "Änderung der Wertigkeiten"
        inhalt: |
          Die Wertigkeiten der Kürelemente haben sich geändert. Zusätzlich sind vorgegebene
          Wertigkeiten für Sprungkombinationen hinzugekommen.

      - typ: abschnitt
        kasten: rosa
        titel: "Änderung des Wertungssystems!"
        inhalt: |
          Die A-Note wird ab der Saison 2026 nicht mehr nur durch Sprungelemente und
          Pirouetten zusammengesetzt, sondern wird dreigeteilt und durch die Skatingskills
          ergänzt.

      - typ: abschnitt
        titel: "Sonderregelungen NRW Meisterschaften"
        kopfzeile: "Sonderregelungen NRW Meisterschaften"
        neue_seite: true
        inhalt: |
          **Anzahl Starter pro Verein**

          Einzellauf A0 - max. 5 Starter
          Einzellauf A1 - max. 8 Starter
          Zweier-/ Paar-/ und Gruppenlauf - max. 6 Starter pro Leistungsklasse

          **Sonderqualifikation Einzellauf A1 bis NWK**

          Jedem Verein ist erlaubt, maximal eine/n Läufer/in pro Saison ein
          Überspringen der Startkategorie „Einzellauf Anfänger 1" oder einen Aufstieg in
          eine höhere Klasse zu ermöglichen. Diese/r Läufer/in muss den anderen Vereinen
          im Voraus namentlich mitgeteilt werden. Der jeweilige Verein entscheidet nach
          Ermessen, ob der Start gerechtfertigt ist.

          **Gruppenläufe**

          Es ist erlaubt, Gruppenläufe geschlechtsunspezifisch zu bilden. Dabei ist es
          unerheblich, wie die Aufteilung (männlich, weiblich, neutral) sortiert ist.

      - typ: hinweis
        inhalt: |
          **Unsportliches Verhalten** Abzug in der B Note.
          Entsprechend der Schwere des Verstoßes mit -0,3 – -1,0

  - titel: Startbedingungen und Kürlaufzeiten
    id: startbedingungen
    kopfzeile: Startbedingungen
    neue_seite: true
    bloecke:
      - typ: abschnitt
        titel: "Einzellauf – Landesebene"
        inhalt: |
          | Klasse | Prüfung | Kürlaufzeit | Gesang |
          |--------|---------|-------------|--------|
          | Anfänger 0 | — | 01:30 – 02:00 | Nein |
          | Anfänger 1 | A1-Freiläufer | 01:30 – 02:00 | Nein |
          | Anfänger 2 | A2-Figurenläufer | 01:30 – 02:00 | Nein |
          | Fortgeschrittene 1 | A3-Kunstläufer | 02:00 – 02:30 | Nein |
          | Fortgeschrittene 2 | A3-Kunstläufer | 02:00 – 02:30 | Ja |
          | Nachwuchsklasse | Kür 3 | 03:00 ± 10 Sek. | Ja |
          | Juniorenklasse | Kür 3 | 03:30 ± 10 Sek. | Ja |
          | Meisterklasse | Kür 3 | 03:30 ± 10 Sek. | Ja |
          | Meisterklasse Elite | Kür 3 | 04:00 ± 10 Sek. | Ja |

      - typ: abschnitt
        titel: "Einzellauf – Bundesebene"
        inhalt: |
          | Klasse | Prüfung | Kürlaufzeit | Gesang |
          |--------|---------|-------------|--------|
          | Nachwuchsklasse | Kür 3 | 03:00 ± 10 Sek. | Ja |
          | Juniorenklasse | Kür 3 | 03:30 ± 10 Sek. | Ja |
          | Meisterklasse | Kür 3 | 03:30 ± 10 Sek. | Ja |
          | Meisterklasse Elite | Kür 3 | 04:00 ± 10 Sek. | Ja |

      - typ: abschnitt
        titel: "Zweier-/Paar-/Gruppenlauf – Landesebene"
        inhalt: |
          | Klasse | Prüfung | Kürlaufzeit | Gesang |
          |--------|---------|-------------|--------|
          | Anfänger 1 | — | 02:00 | Nein |
          | Anfänger 2 | — | 02:00 | Nein |
          | Fortgeschrittene | — | 02:00 – 02:30 | Nein |
          | Nachwuchsklasse | Kür 4 | 03:30 ± 10 Sek. | Ja |
          | Juniorenklasse | Kür 4 | 03:30 ± 10 Sek. | Ja |
          | Meisterklasse | Kür 3 | 04:00 ± 10 Sek. | Ja |

      - typ: abschnitt
        titel: "Voraussetzungen"
        inhalt: |
          - **Lizenzen:** Alle Starter:innen benötigen eine gültige Startlizenz
          - **Prüfungen:** Müssen vor dem Wettbewerb abgelegt worden sein

      - typ: abschnitt
        titel: "Musiken"
        inhalt: |
          - Musik mit Gesang ist ab Fortgeschrittene 2 erlaubt
          - Die Musiklänge muss der Kürlaufzeit der jeweiligen Klasse entsprechen

      - typ: hinweis
        inhalt: |
          **Einlaufzeiten:** Kür = Kürlaufzeit + 1 Minute. Pflicht = 10 Min. + 5 Min.

          **Abweichungen:** Da in NRW auch Hessen-Starter:innen starten, gelten die dort
          geltenden Prüfungsordnungen ebenfalls.

      - typ: abschnitt
        titel: "Kleiderordnung"
        inhalt: |
          - **Kleidung:** Kleidung darf nicht übertrieben sein, kann jedoch den Charakter der Musik unterstreichen
          - **Strasssteine:** Ausschließlich bis max. 4 mm Durchmesser empfohlen
          - **Haar-/Kopfschmuck:** Begrenzt erlaubt, jedoch keine Federn, Hüte, Kopftücher oder Masken
          - **Make-up:** Darf nicht übertrieben sein, kann den Charakter der Musik unterstreichen
          - **Requisiten:** Requisiten in der Hand oder auf der Bahn sind nicht erlaubt. Beleuchtung der Kostüme ist untersagt.

  - titel: Kürvorgaben
    id: kuervorgaben
    kopfzeile: Kürvorgaben
    neue_seite: true
    bloecke:
      - typ: vorgabe
        name: "Anfänger 0 (A0)"
        regeln:
          - "Sprünge: Dreiersprung, Toeloop, Salchow"
          - "Zweibeinpirouette (mind. 3 Umdrehungen)"
          - "Standpirouette re bzw. ve (mind. 2 Umdrehungen)"
          - "Pflicht: 2 Sprünge + 1 Pirouette müssen gezeigt werden"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | — |
          | Musiklänge | 01:30 – 02:00 |
          | Gesang | Nein |
          | Abzüge nicht-erlaubtes Element | -0,5 A |

      - typ: vorgabe
        name: "Anfänger 1 (A1)"
        regeln:
          - "Sprünge: Dreiersprung, Toeloop, Salchow, Flip"
          - "Zweibeinpirouette (mind. 3 Umdrehungen)"
          - "Standpirouette re bzw. ve (mind. 2 Umdrehungen)"
          - "Pflicht: Choreo-Step Sequenz"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | A1-Freiläufer |
          | Musiklänge | 01:30 – 02:00 |
          | Gesang | Nein |
          | Abzüge nicht-erlaubtes Element | -0,5 A |

      - typ: vorgabe
        name: "Anfänger 2 (A2)"
        regeln:
          - "Sprünge: Alle einfachen Sprünge ohne Axel"
          - "Alle Standpirouetten (mind. 3 Umdrehungen)"
          - "Alle Sitzpirouetten (mind. 2 Umdrehungen)"
          - "Pflicht: Choreo-Step Sequenz + mind. 4 Schrittelemente"
          - "Untersagt: Axel, Waagepirouetten"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | A2-Figurenläufer |
          | Musiklänge | 01:30 – 02:00 |
          | Gesang | Nein |
          | Abzüge nicht-erlaubtes Element | -0,5 A |

      - typ: vorgabe
        name: "Fortgeschrittene 1 (F1)"
        regeln:
          - "Sprünge: Alle einfachen Sprünge"
          - "Axel (3/4 erlaubt, mehr als eine Runde)"
          - "Alle Stand-/Sitzpirouetten (mind. 3 Umdrehungen)"
          - "Waagepirouetten va, ra (mind. 2 Umdrehungen)"
          - "Kombination erlaubt"
          - "Pflicht: Schrittfolge nach 3-Quadrantenregel mit Start/Stop Position"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | A3-Kunstläufer |
          | Musiklänge | 02:00 – 02:30 |
          | Gesang | Nein |
          | Abzüge nicht-erlaubtes Element | -0,5 A |

      - typ: vorgabe
        name: "Fortgeschrittene 2 (F2)"
        regeln:
          - "Sprünge: Alle einfachen Sprünge, Axel"
          - "Ein Doppelsprung nach Wahl (auf vorwärts erlaubt)"
          - "Alle Stand-/Sitzpirouetten (mind. 3 Umdrehungen)"
          - "Waagepirouetten va, ra (mind. 2 Umdrehungen)"
          - "Kombination erlaubt"
          - "Pflicht: Schrittfolge nach 3-Quadrantenregel"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | A3-Kunstläufer |
          | Musiklänge | 02:00 – 02:30 |
          | Gesang | Ja |
          | Abzüge nicht-erlaubtes Element | -0,5 A |

      - typ: vorgabe
        name: "Nachwuchsklasse (NWK)"
        neue_seite: true
        regeln:
          - "Sprünge: Alle einfachen und Doppelsprünge inkl. Kombinationen und Axel"
          - "Alle Stand-/Sitz-/Waagepirouetten (mind. 3 Umdrehungen) und Kombinationen"
          - "Pflicht: Schrittfolge nach 3-Quadrantenregel"
          - "Beschränkung: Ein Sprung auf vorwärts erlaubt"
          - "Beschränkung: Toeloop als Einzelsprung, Verbindungssprung oder letzter Sprung in Kombination untersagt"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | Kür 3 |
          | Musiklänge | 03:00 ± 10 Sek. |
          | Gesang | Ja |
          | Abzüge bei Regelverstoß | -0,5 A |

      - typ: vorgabe
        name: "Juniorenklasse"
        regeln:
          - "Sprünge: Alle einfachen und Doppelsprünge inkl. Kombinationen und Axel"
          - "Alle Stand-/Sitz-/Waagepirouetten (mind. 3 Umdrehungen) und Kombinationen"
          - "Pflicht: Schrittfolge nach 3-Quadrantenregel"
          - "Beschränkung: Toeloop als Einzelsprung, Verbindungssprung oder letzter Sprung in Kombination untersagt"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | Kür 3 |
          | Musiklänge | 03:30 ± 10 Sek. |
          | Gesang | Ja |
          | Abzüge bei Regelverstoß | -0,5 A |

      - typ: vorgabe
        name: "Meisterklasse Einzellauf"
        regeln:
          - "Sprünge: Alle einfachen Sprünge + Axel"
          - "Doppelsprünge: Toeloop, Salchow, 1 weiterer nach Wahl"
          - "Alle Stand-/Sitz-/Waagepirouetten"
          - "Pirouetten Kategorie B (mind. 3 Umdrehungen) bis Camel Sideways/Sitzkombinationen"
          - "Plus eine der folgenden: Hacke va, Hacke ra, Inverted, Broken Ankle, Biellmann, Bryant, Biellmann Hacke"
          - "Pflicht: Schrittfolge"
          - "Beschränkung: Doppelsprünge & Pirouetten gemäß Vorgabe"
          - "Beschränkung: Toeloop als Einzelsprung, Verbindungssprung oder letzter Sprung in Kombination untersagt"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | Kür 3 |
          | Musiklänge | 03:30 ± 10 Sek. |
          | Gesang | Ja |
          | Abzüge bei Regelverstoß | -0,5 A |

      - typ: vorgabe
        name: "Meisterklasse Elite"
        regeln:
          - "Alles erlaubt"
          - "Pflicht: Schrittfolge"
          - "Beschränkung: Toeloop als Einzelsprung, Verbindungssprung oder letzter Sprung in Kombination untersagt"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | Kür 3 |
          | Musiklänge | 04:00 ± 10 Sek. |
          | Gesang | Ja |
          | Abzüge bei Regelverstoß | -0,5 A |

      - typ: abschnitt
        titel: "Zweier-/Paar-/Gruppenlauf"
        neue_seite: true
        inhalt: |
          **A1:** Analog zum Einzellauf A1. Keine Prüfung. 02:00. Kein Gesang. Abzüge: -0,5 A.

          **A2:** Analog zum Einzellauf A2. Keine Prüfung. 02:00. Kein Gesang. Abzüge: -0,5 A.

          **Fortgeschrittene:** Analog zum Einzellauf Fortgeschrittene 1. Keine Prüfung. 02:00 – 02:30. Kein Gesang. Abzüge: -0,5 A.

      - typ: vorgabe
        name: "Zweier-/Gruppenlauf Nachwuchsklasse"
        regeln:
          - "Sprünge/Pirouetten: Wie Einzellauf Nachwuchsklasse"
          - "Beschränkung: Max. 4 Einzelsprünge und zusätzlich 2 Sprungkombinationen erlaubt"
          - "Beschränkung: Toeloop als Einzelsprung, Verbindungssprung oder letzter Sprung in Kombination untersagt"
        pruefung: |
