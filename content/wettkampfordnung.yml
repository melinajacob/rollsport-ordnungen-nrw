  - titel: Wertungsschema Kür
    id: wertungsschema
    kopfzeile: Wertungsschema Kür
    neue_seite: true
    bloecke:
      - typ: abschnitt
        titel: "A-Note (Gedrittelt)"
        inhalt: |
          Die A-Note setzt sich aus drei gleichgewichteten Teilen zusammen:

          | Teil | Anteil |
          |------|--------|
          | Sprünge | 1/3 |
          | Pirouetten | 1/3 |
          | Skating Skills | 1/3 |

      - typ: abschnitt
        titel: "B-Note"
        inhalt: |
          **Spielraum:** -1,5 bis +1,5

          Bewertung der künstlerischen Gestaltung, Ausdruck, Musikinterpretation und Choreografie.

      - typ: abschnitt
        titel: "Regelverstöße"
        inhalt: |
          | Anzahl Verstöße | Abzug A-Note |
          |-----------------|-------------|
          | 1 | -0,5 |
          | 2 | -0,7 |
          | 3 | -1,0 |

      - typ: abschnitt
        titel: "Sprungwertigkeiten (Auswahl)"
        neue_seite: true
        inhalt: |
          | Sprung | Wertigkeit |
          |--------|-----------|
          | Alle Figuren | 1,2 |
          | Dreiersprung | 1,2 |
          | Toeloop | 1,5 |
          | Salchow | 1,5 |
          | Flip | 1,8 |
          | Lutz | 2,0 |
          | Rittberger | 2,0 |
          | Axel | 3,0 |
          | Doppel-Toeloop | 4,5 |
          | Doppel-Salchow | 4,5 |
          | Doppel-Flip | 5,5 |
          | Doppel-Lutz | 6,0 |
          | Doppel-Rittberger | 6,0 |
          | Doppel-Axel | 8,7 |

          **Sprünge mit 1 1/2 Runden:** +0,1
          **Sprünge mit 1 3/4 Runden:** +0,2

      - typ: abschnitt
        titel: "Pirouettenwertigkeiten (Auswahl)"
        inhalt: |
          | Pirouette | Wertigkeit | Klasse |
          |-----------|-----------|--------|
          | Zweibeinpirouette | 1,5 | — |
          | Tscherkessen/Sit behind | 3,8 | B |
