titel: Meisterschaftsordnung
untertitel: mit Wertungsrichtlinien für Wertungsrichter:innen
saison: "2026"
stand: "02.03.2026"
stand_wr: "16.04.24"
stand_formation: "03.06.24"
kapitel:
  - titel: Regelungen Meisterschaften
    id: regelungen
    kopfzeile: Regelungen Meisterschaften
    bloecke:
      - typ: abschnitt
        titel: "Neuerungen von Saison 2025 zu 2026"
        inhalt: |
          - Trennung der Wettbewerbe Fortgeschrittene 1 (Pflicht und Kür getrennt)
          - Sonderwettbewerb Anfänger 0 (neue Kategorie A0, max. 5 Läufer/Verein)
          - Änderungen Anforderungen Einzellauf Kür Meisterklasse (Biellmann, Bryant, Biellmann Hacke)
          - Änderung der Wertigkeiten
          - Änderung des Wertungssystems (A-Note gedrittelt: Sprünge 1/3, Pirouetten 1/3, Skating Skills 1/3)

      - typ: abschnitt
        titel: "Sonderregelungen NRW"
        inhalt: |
          **Anzahl Starter pro Verein:**
          - A0: max. 5 Läufer:innen
          - A1: max. 8 Läufer:innen
          - Zweier-/Paar-/Gruppenlauf: max. 6 pro Verein

          **Sonderqualifikation:** Einzellauf A1 bis Nachwuchsklasse

          **Gruppenläufe:** Geschlechtsunspezifisch erlaubt

          **Unsportliches Verhalten:** B-Note-Abzug -0,3 bis -1,0

  - titel: Startbedingungen und Kürlaufzeiten
    id: startbedingungen
    kopfzeile: Startbedingungen
    neue_seite: true
    bloecke:
      - typ: abschnitt
        titel: "Einzellauf – Landesebene"
        inhalt: |
          | Klasse | Prüfung | Kürlaufzeit | Gesang |
          |--------|---------|-------------|--------|
          | Anfänger 0 | keine | 01:30 – 02:00 | Nein |
          | Anfänger 1 | A1 | 01:30 – 02:00 | Nein |
          | Anfänger 2 | A2 | 01:30 – 02:00 | Nein |
          | Fortgeschrittene 1 | A3 | 02:00 – 02:30 | Nein |
          | Fortgeschrittene 2 | A3 | 02:00 – 02:30 | Ja |
          | Nachwuchsklasse | Kür 3 | 03:00 ± 10 Sek. | Ja |
          | Juniorenklasse | Kür 3 | 03:30 ± 10 Sek. | Ja |
          | Meisterklasse | Kür 3 | 03:30 ± 10 Sek. | Ja |
          | Meisterklasse Elite | Kür 3 | 04:00 ± 10 Sek. | Ja |

      - typ: abschnitt
        titel: "Zweier-/Paar-/Gruppenlauf – Landesebene"
        inhalt: |
          | Klasse | Prüfung | Kürlaufzeit | Gesang |
          |--------|---------|-------------|--------|
          | Anfänger 1 | keine | 02:00 | Nein |
          | Anfänger 2 | keine | 02:00 | Nein |
          | Fortgeschrittene | keine | 02:00 – 02:30 | Nein |
          | Nachwuchsklasse | Kür 4 | 03:30 ± 10 Sek. | Ja |
          | Juniorenklasse | Kür 4 | 03:30 ± 10 Sek. | Ja |
          | Meisterklasse | Kür 3 | 04:00 ± 10 Sek. | Ja |

      - typ: abschnitt
        titel: "Voraussetzungen"
        inhalt: |
          - **Lizenzen:** Alle Starter:innen benötigen eine gültige Lizenz
          - **Prüfungen:** Müssen vor dem Wettbewerb abgelegt sein

      - typ: abschnitt
        titel: "Musiken"
        inhalt: |
          - Musik mit Gesang ist ab Fortgeschrittene 2 erlaubt
          - Die Musiklänge muss der Kürlaufzeit der jeweiligen Klasse entsprechen

      - typ: hinweis
        inhalt: |
          **Einlaufzeiten:** Kür = Kürlaufzeit + 1 Minute. Pflicht = 10 Min. + 5 Min.

      - typ: abschnitt
        titel: "Kleiderordnung"
        inhalt: |
          - Strasssteine: max. 4 mm Durchmesser
          - Haar-/Kopfschmuck erlaubt
          - Dezentes Make-up erlaubt
          - Requisiten sind nicht erlaubt

  - titel: Kürvorgaben
    id: kuervorgaben
    kopfzeile: Kürvorgaben
    neue_seite: true
    bloecke:
      - typ: vorgabe
        name: "Anfänger 0"
        regeln:
          - "Dreiersprung, Toeloop, Salchow"
          - "Zweibeinpirouette (3 Umdrehungen)"
          - "Standpirouette (2 Umdrehungen)"
        pruefung: |
          **Pflicht:** 2 Sprünge + 1 Pirouette

          | | |
          |---|---|
          | Prüfung | Keine |
          | Musiklänge | 01:30 – 02:00 |
          | Gesang | Nein |
          | Abzüge | 0,5 pro nicht-erlaubtem Element |

      - typ: vorgabe
        name: "Anfänger 1"
        regeln:
          - "Dreiersprung, Toeloop, Salchow, Flip"
          - "Choreo-Step Sequenz"
          - "Zweibeinpirouette (3 Umdrehungen)"
          - "Standpirouette (2 Umdrehungen)"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | A1 |
          | Musiklänge | 01:30 – 02:00 |
          | Gesang | Nein |
          | Abzüge | 0,5 pro nicht-erlaubtem Element |

      - typ: vorgabe
        name: "Anfänger 2"
        regeln:
          - "Alle einfachen Sprünge ohne Axel"
          - "Standpirouetten (3 Umdrehungen)"
          - "Sitzpirouetten (2 Umdrehungen)"
          - "Choreo-Step + 4 Schrittelemente"
        pruefung: |
          **Untersagt:** Axel, Waagepirouetten

          | | |
          |---|---|
          | Prüfung | A2 |
          | Musiklänge | 01:30 – 02:00 |
          | Gesang | Nein |
          | Abzüge | 0,5 pro nicht-erlaubtem Element |

      - typ: vorgabe
        name: "Fortgeschrittene 1"
        regeln:
          - "Axel (3/4)"
          - "Stand-/Sitzpirouetten (3 Umdrehungen)"
          - "Waagepirouetten va/ra (2 Umdrehungen, Kombination)"
          - "Schrittfolge nach 3-Quadrantenregel"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | A3 |
          | Musiklänge | 02:00 – 02:30 |
          | Gesang | Nein |
          | Abzüge | 0,5 pro nicht-erlaubtem Element |

      - typ: vorgabe
        name: "Fortgeschrittene 2"
        regeln:
          - "1 Doppelsprung erlaubt"
          - "Waagepirouetten va/ra"
          - "Schrittfolge"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | A3 |
          | Musiklänge | 02:00 – 02:30 |
          | Gesang | Ja |
          | Abzüge | 0,5 pro nicht-erlaubtem Element |

      - typ: vorgabe
        name: "Nachwuchsklasse"
        neue_seite: true
        regeln:
          - "Alle einfachen und Doppelsprünge + Axel"
          - "Alle Pirouetten (3 Umdrehungen) + Kombinationen"
          - "Schrittfolge"
          - "Beschränkung: 1 Sprung auf vorwärts"
          - "Toeloop-Beschränkung"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | Kür 3 |
          | Musiklänge | 03:00 ± 10 Sek. |
          | Gesang | Ja |
          | Abzüge | 0,5 pro Regelverstoß |

      - typ: vorgabe
        name: "Juniorenklasse"
        regeln:
          - "Alle einfachen und Doppelsprünge + Axel"
          - "Alle Pirouetten + Kombinationen"
          - "Toeloop-Beschränkung"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | Kür 3 |
          | Musiklänge | 03:30 ± 10 Sek. |
          | Gesang | Ja |
          | Abzüge | 0,5 pro Regelverstoß |

      - typ: vorgabe
        name: "Meisterklasse"
        regeln:
          - "Alle einfachen Sprünge + Axel"
          - "Doppel-Toeloop, Doppel-Salchow + 1 weiterer Doppelsprung"
          - "Pirouetten Kategorie B"
          - "Zusätzlich eine aus: Hacke va/ra, Inverted, Broken Ankle, Biellmann, Bryant, Biellmann Hacke"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | Kür 3 |
          | Musiklänge | 03:30 ± 10 Sek. |
          | Gesang | Ja |
          | Abzüge | 0,5 pro Regelverstoß |

      - typ: vorgabe
        name: "Meisterklasse Elite"
        regeln:
          - "Alles erlaubt"
        pruefung: |
          | | |
          |---|---|
          | Prüfung | Kür 3 |
          | Musiklänge | 04:00 ± 10 Sek. |
          | Gesang | Ja |

      - typ: abschnitt
        titel: "Zweier-/Paar-/Gruppenlauf"
        neue_seite: true
        inhalt: |
          **A1:** Analog Einzellauf A1. Keine Prüfung. 02:00. Kein Gesang.

          **A2:** Analog Einzellauf A2. Keine Prüfung. 02:00. Kein Gesang.

          **Fortgeschrittene:** Analog Fortgeschrittene 1. Keine Prüfung. 02:00 – 02:30. Kein Gesang.

          **Nachwuchsklasse:** Wie Einzellauf NWK. Max. 4 Einzelsprünge, 2 Sprungkombinationen. Prüfung Kür 4. 03:30 ± 10 Sek. Gesang ja.

          **Juniorenklasse:** Max. 4 Einzelsprünge, 2 Doppelsprünge, 2 Sprungkombinationen. Prüfung Kür 4. 03:30 ± 10 Sek. Gesang ja.

          **Meisterklasse:** Wie Einzellauf MK. Prüfung Kür 3. 04:00 ± 10 Sek. Gesang ja.

