  - titel: Formationsrichtlinien
    id: formationen
    kopfzeile: Formationsrichtlinien
    neue_seite: true
    bloecke:
      - typ: startbedingungen
        klasse: "Schülerformation"
        alter: "8–15 Jahre"
        voraussetzung: "Prüfung A2"
        programm: |
          - **Anzahl Läufer:** 8–16
          - **Kürlaufzeit:** 03:30 – 04:00
          - **Gesang:** Ja
          - **Sprünge:** Max. 1/2 Umdrehung
          - **Hebungen:** Nicht erlaubt

      - typ: startbedingungen
        klasse: "Juniorenformation"
        alter: "8–18 Jahre"
        voraussetzung: "Prüfung A3"
        programm: |
          - **Anzahl Läufer:** 12–16
          - **Kürlaufzeit:** 04:00 ± 10 Sek.
          - **Gesang:** Ja
          - **Hebungen:** Nicht erlaubt

      - typ: startbedingungen
        klasse: "Meisterklasse Formation"
        alter: "Mindestalter 12"
        voraussetzung: "Prüfung Kür oder Pflicht 4"
        programm: |
          - **Anzahl Läufer:** 12–16
          - **Kürlaufzeit:** 04:30 – 05:00
          - **Gesang:** Ja
          - **Choreografischer Stop:** Max. 10 Sek. erlaubt

      - typ: abschnitt
        titel: "Kleiderordnung Formation"
        inhalt: |
          **Damen:** Röcke oder Hosen (keine Leggings). Bodys nur mit Rock.

          **Herren:** Hosen. Trikots dürfen nicht ärmellos sein, Dekolleté vollständig bedeckt.

          Die Kleidung darf nicht übertrieben sein, kann jedoch den Charakter der Musik unterstreichen. Strasssteine max. 4mm aufkleben empfohlen. Kopfschmuck begrenzt erlaubt (keine Federn, Hüte, Kopftücher, Masken). Make-up nicht übertrieben. Requisiten und Beleuchtung der Kostüme untersagt.

      - typ: abschnitt
        titel: "Programmaufbau Formation"
        inhalt: |
          1. Vokalmusik ist erlaubt
          2. Ausgeglichenes Programm mit anerkannten Formationselementen (Kreise, Mühlen, Kreuzungen, Blöcke, Linien, Schrittfolgen)
          3. Übergänge zwischen Elementen klar ausgestaltet
          4. Die Lauffläche sollte maximal ausgenutzt werden
          5. Stillstand während der Kür nicht erlaubt (außer choreografischer Stop)
          6. Bewegungen und Schritte im Einklang mit der Musik
          7. Tempowechsel sollen zur Originalität beitragen

          **Choreografischer Stop (Junioren- & Meisterklassenformation):** Max. 10 Sekunden, nicht am Anfang oder Ende. Bei Meisterklasse darf eine Hebung eingebaut werden (von der Gruppe, nicht nur von 2 Läufern).

      - typ: abschnitt
        titel: "Bewertung Formation"
        neue_seite: true
        inhalt: |
          **A-Note:** Technischer Wert. Basisnote 1,0, Gesamtnote 1,0 – 10,0. Schwierigkeitsgrad der Elemente bewerten.

          **B-Note:** Harmonie und künstlerischer Eindruck. Grundlage A-Note, Abweichung ± 1,5.

          Bewertungskriterien: Präzision der Elemente, Gleichmäßigkeit/Synchronität, Geschwindigkeit und Fluss, Originalität, Platzverteilung, Läuferische Qualität.

      - typ: abschnitt
        titel: "Formationselemente – Kreise"
        inhalt: |
          | Stufe | Beschreibung | Wertung | Kriterien |
          |-------|-------------|---------|-----------|
          | K1 | Ohne Richtungswechsel, ohne Variation der Kreisgröße | 0,1 – 2,0 | Figur, vw./rw., Armhaltung, einfache Schritte |
          | K2 | Ohne Richtungswechsel mit Variationen in der Größe | 2,1 – 4,2 | Ohne direkte Handhaltung (offener Kreis) + K1 |
          | K3 | Mit Richtungswechsel & Schrittfolgen / Kreuzungen / Wanderung | 4,3 – 6,6 | Schwierigkeit Schritte, Anzahl Personen die kreuzen + K2 |
          | K4 | Mit Schrittelementen & Kreuzungen & wandern | 6,6 – 9,0 | Wanderstrecke + K3 |

      - typ: abschnitt
        titel: "Formationselemente – Mühlen"
        inhalt: |
          | Stufe | Beschreibung | Wertung | Kriterien |
          |-------|-------------|---------|-----------|
          | M1 | 2 oder mehr Speichen, ein Drehmittelpunkt | 0,1 – 2,0 | Figur, vw./rw., Armhaltung, einfache Schritte, Umdrehungen |
          | M2 | Mehr als ein Drehpunkt (Doppelmühle / schneidende Mühlen), S-Mühle | 2,1 – 4,2 | Figur, vw./rw., Armhaltung, einfache Schritte, Umdrehungen |
          | M3 | Kombination M1 & M2 oder Mühle mit offener Mitte | 4,3 – 6,6 | Anzahl der Wechsel in der Mühlenart |
          | M4 | M1, M2, M3 plus Wandern | 6,6 – 9,0 | Wanderstrecke + M2/M3 |

      - typ: abschnitt
        titel: "Formationselemente – Blöcke, Kreuzungen, Linien"
        inhalt: |
          **Blöcke:**

          | Stufe | Beschreibung | Wertung |
          |-------|-------------|---------|
          | B1 | Angefasst, senkrecht zur Mittelachse, mind. 2 Reihen | 0,1 – 2,0 |
          | B2 | Mehrere Achsen diagonal und senkrecht, offener Block | 2,1 – 4,2 |
          | B3 | Offen mit Schrittelementen | 4,3 – 6,6 |
          | B4 | Pivotblock mit Schrittelementen | 6,6 – 9,0 |

          **Kreuzungen:**

          | Stufe | Beschreibung | Wertung |
          |-------|-------------|---------|
          | KG1 | Mind. 2 Reihen mit einer Kreuzlinie (gerade/diagonal) | 0,1 – 2,0 |
          | KG2 | Mehrere Reihen mit mehreren Kreuzlinien (4eck / 3eck) | 2,1 – 4,2 |
          | KG3 | Mehrere Reihen mit diagonaler Kreuzlinie, aufschlagende Kreise | 4,3 – 6,6 |
          | KG4 | KG2/KG3 mit Schrittelementen, aufschlagende Kreise mit Drehung | 6,6 – 9,0 |

          **Linien mit Schrittfolge:**

          | Stufe | Beschreibung | Wertung |
          |-------|-------------|---------|
          | L1 | Beibehaltung einer Achse, einfache Schritte | 0,1 – 2,0 |
          | L2 | Wechsel Anzahl der Linien, Beibehaltung einer Achse | 2,1 – 4,2 |
          | L3 | Änderung der Achse + Schritte (Doppeldreier, Mohawk, Choctow, Dreier) | 4,3 – 6,6 |
          | L4 | Änderung der Achse + Schritte (Wende, Gegenwende, Gegendreier, 180°, Crossrolls) | 6,6 – 9,0 |

      - typ: abschnitt
        titel: "Weitere Bewertungsmerkmale Formation"
        inhalt: |
          **Schritte:**

          | Stufe | Beschreibung |
          |-------|-------------|
          | S1 | Mohawk, Choctow, Dreier |
          | S2 | S1 + Doppeldreier |
          | S3 | S2 + Wenden, Gegenwenden, Gegendreier |
          | S4 | S2 & S3 + Drehungen 180°, Crossrolls |

          **Handhaltungen:**

          | Stufe | Beschreibung |
          |-------|-------------|
          | H1 | Handgelenk, Hand-in-Hand, Oberarm |
          | H2 | H1 + Arme im Winkel, Arm an Ellbogen |
          | H3 | H2 + Kettengriff, Kreuzgriff |
          | H4 | H1 – H3 + offene Haltung (mind. 3 Sekunden) |

      - typ: abschnitt
        titel: "Abzüge Formation"
        inhalt: |
          **Stürze:**

          | Situation | Abzug |
          |-----------|-------|
          | Kurzer Sturz von einem Läufer | 0,2 |
          | Längerer Sturz oder kurzer Sturz mit mehreren Läufern | 0,6 |
          | Mehr als ein Läufer für eine längere Zeit | 0,8 – 1,0 |

          **Programmaufbau:**

          | Situation | Abzug |
          |-----------|-------|
          | Stillstand / Liegen auf der Fläche | 0,2 pro Element |
          | Programm zu lang / zu kurz | 0,2 pro 10 Sekunden |
          | Sprünge mit mehr als einer Drehung | 0,4 |
          | Nicht erlaubte Hebung | 0,4 |

  - titel: Begriffserläuterungen
    id: begriffe
    kopfzeile: Begriffserläuterungen
    neue_seite: true
    bloecke:
      - typ: abschnitt
        titel: "Schrittfolge"
        inhalt: Eine Abfolge von reinen Schritten

      - typ: abschnitt
        titel: "Choreo-Step Sequenz"
        inhalt: Eine Abfolge von Schritten, Figuren oder ein Tanz auf der Stelle

      - typ: abschnitt
        titel: "3 Quadrantenregel"
        inhalt: |
          Die Lauffläche wird in vier Quadrate aufgeteilt. Bei dieser Regelung muss die gelaufene Schrittfolge mind. durch 3 dieser Quadrate laufen

      - typ: abschnitt
        titel: "Start/Stop Position"
        inhalt: |
          Hierbei soll eine Schrittfolge aus dem Stand begonnen werden und darf in beliebiger Position auslaufen

      - typ: abschnitt
        titel: "Figurenserpentine"
        inhalt: Die Darbietung einer Figur in einer S-(Schlangen)förmigen Form

      - typ: abschnitt
        titel: "Merkmale eines Gruppenlaufs"
        neue_seite: true
        inhalt: |
          **Technik:**
          - Alle machen das gleiche Element
          - Synchronität
          - Gruppenelemente
          - Kein lautes Vorzählen

          **Choreo:**
          - Lauffläche muss genutzt werden
          - Richtungswechsel
          - Akrobatisches Element
          - Geschlossenheit
          - Positionsvariationen

          **Wertung:**
          - 3 müssen das Element richtig zeigen, kein Sturz
          - Je enger die Läufer:innen zusammen stehen, desto höher die Wertigkeit
          - Elemente, die nicht von allen Läufer:innen im Sichtfeld der WR gezeigt werden, sind nicht wertbar
          - Vorgeschriebene Elemente müssen beachtet werden

      - typ: abschnitt
        titel: "Pirouetten – Bewertungsmerkmale"
        inhalt: |
          Eine Pirouette besteht aus den folgenden Merkmalen:

          - **Anlauf**
          - **Eingang**
          - **Zentrierung**
          - **Kante**
          - **Umdrehungen**
          - **Wechsel** – Füße werden eng gesetzt, schneller Positionswechsel
          - **Position** – Schnell in neue Position
          - **Auslauf** – Nicht über den Stopper

  - titel: Anfänger Kürpokal
    id: kuerpokall
    kopfzeile: Anfänger Kürpokal
    neue_seite: true
    bloecke:
      - typ: abschnitt
        titel: "Anfänger Kürpokal"
        inhalt: |
          Der Kürpokal ist ein Wettbewerb für die Anfängerklassen (Anfänger 1 und Anfänger 2). Es gibt ausschließlich Einzelwettbewerbe. Die Läufer:innen werden dabei nach Jahrgängen eingeteilt und treten gegen gleichaltrige Konkurrent:innen an.

          | | |
          |---|---|
          | **Kürlaufzeit** | 01:30 – 02:00 min |
          | **Einlaufzeit** | 02:30 min |
          | **Prüfungen** | Keine erforderlich |
          | **Kürvorgaben** | Keine Beschränkungen (abwechslungsreich, Kombination aus Figuren, Schritten, Sprüngen und Pirouetten) |

      - typ: hinweis
        inhalt: |
          Alle Läufer:innen, die in der vorherigen Saison **nicht** bei den Landesmeisterschaften gestartet sind oder in der Klasse A0 gestartet sind, dürfen teilnehmen.

