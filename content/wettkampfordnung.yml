          | Nr. | Bogen | Punkte |
          |-----|-------|--------|
          | 50 | Doppeldreier-Gegenwende-Paragraph .va | 0,5 |
          | 39 | Schlingen-Paragraph .ra | 0,5 |
          | 51 | Gegendreier-Wende-Paragraph .va | 0,7 |

          **ME4**

          | Nr. | Bogen | Punkte |
          |-----|-------|--------|
          | 52 | Doppeldreier-Gegenwende-Paragraph .ra | 0,5 |
          | 38 | Schlingen-Paragraph .va | 0,5 |
          | 53 | Gegendreier-Wende-Paragraph .ra | 0,7 |

      - typ: abschnitt
