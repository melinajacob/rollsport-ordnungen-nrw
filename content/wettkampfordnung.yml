titel: Meisterschaftsordnung
untertitel: mit Wertungsrichtlinien für Wertungsrichter:innen
saison: "2026"
stand: "02.03.2026"
stand_wr: "16.04.24"
stand_formation: "03.06.24"
kapitel:
  - titel: Regelungen Meisterschaften
    id: regelungen
    kopfzeile: Regelungen Meisterschaften
    bloecke:
      - typ: abschnitt
        titel: "Neuerungen von Saison 2025 zu 2026"
        inhalt: |
          - Trennung der Wettbewerbe Fortgeschrittene 1 (Pflicht und Kür getrennt)
          - Sonderwettbewerb Anfänger 0 (neue Kategorie A0, max. 5 Läufer/Verein)
          - Änderungen Anforderungen Einzellauf Kür Meisterklasse (Biellmann, Bryant, Biellmann Hacke)
          - Änderung der Wertigkeiten
          - Änderung des Wertungssystems (A-Note gedrittelt: Sprünge 1/3, Pirouetten 1/3, Skating Skills 1/3)

      - typ: abschnitt
        titel: "Sonderregelungen NRW"
        inhalt: |
          **Anzahl Starter pro Verein:**
          - A0: max. 5 Läufer:innen
          - A1: max. 8 Läufer:innen
          - Zweier-/Paar-/Gruppenlauf: max. 6 pro Verein

          **Sonderqualifikation:** Einzellauf A1 bis Nachwuchsklasse

          **Gruppenläufe:** Geschlechtsunspezifisch erlaubt

          **Unsportliches Verhalten:** B-Note-Abzug -0,3 bis -1,0

  - titel: Startbedingungen und Kürlaufzeiten
    id: startbedingungen
    kopfzeile: Startbedingungen
    neue_seite: true
    bloecke:
      - typ: abschnitt
        titel: "Einzellauf – Landesebene"
        inhalt: |
          | Klasse | Prüfung | Kürlaufzeit | Gesang |
          |--------|---------|-------------|--------|
          | Anfänger 0 | keine | 01:30 – 02:00 | Nein |
          | Anfänger 1 | A1 | 01:30 – 02:00 | Nein |
          | Anfänger 2 | A2 | 01:30 – 02:00 | Nein |
          | Fortgeschrittene 1 | A3 | 02:00 – 02:30 | Nein |
          | Fortgeschrittene 2 | A3 | 02:00 – 02:30 | Ja |
          | Nachwuchsklasse | Kür 3 | 03:00 ± 10 Sek. | Ja |
          | Juniorenklasse | Kür 3 | 03:30 ± 10 Sek. | Ja |
          | Meisterklasse | Kür 3 | 03:30 ± 10 Sek. | Ja |
          | Meisterklasse Elite | Kür 3 | 04:00 ± 10 Sek. | Ja |

      - typ: abschnitt
        titel: "Zweier-/Paar-/Gruppenlauf – Landesebene"
        inhalt: |
          | Klasse | Prüfung | Kürlaufzeit | Gesang |
          |--------|---------|-------------|--------|
          | Anfänger 1 | keine | 02:00 | Nein |
          | Anfänger 2 | keine | 02:00 | Nein |
          | Fortgeschrittene | keine | 02:00 – 02:30 | Nein |
          | Nachwuchsklasse | Kür 4 | 03:30 ± 10 Sek. | Ja |
          | Juniorenklasse | Kür 4 | 03:30 ± 10 Sek. | Ja |
          | Meisterklasse | Kür 3 | 04:00 ± 10 Sek. | Ja |

      - typ: abschnitt
        titel: "Voraussetzungen"
        inhalt: |
          **Lizenzen:** Alle Starter:innen benötigen eine gültige Rollsportlizenz. Die Meldung muss die Geschlechtsangabe enthalten.

          **Prüfungen:** Ab Nachwuchsklasse nicht als Startbedingung für die Landesmeisterschaft nötig, aber für die Bundesmeisterschaft.

      - typ: abschnitt
        titel: "Musiken"
        inhalt: |
          Die Musiklänge muss der vorgegebenen Kürlaufzeit entsprechen. Musik mit Gesang ist ab Fortgeschrittene 2 erlaubt (keine Kraftausdrücke o.ä.).

      - typ: abschnitt
        titel: "Einlaufzeiten"
        inhalt: |
          **Kür:** Kürlaufzeit + 1 Minute. A0/A1/A2 = 2:30 Min. 50 Sekunden Puffer.

          **Pflicht:** 10 Min. allgemein + 5 Min. für die ersten 5 Starter.

      - typ: abschnitt
        titel: "Kleiderordnung"
        inhalt: |
          - **Kleidung:** Rollkunstlaufkleid oder Anzug mit Bein (einteilig)
          - **Strasssteine:** Max. 4 mm Durchmesser, aufkleben empfohlen
          - **Kopfschmuck:** Begrenzt erlaubt (keine Federn, Hüte, Kopftücher, Masken)
          - **Make-up:** Nicht übertrieben
          - **Requisiten:** Nicht erlaubt
          - **Beleuchtung der Kostüme:** Untersagt

  - titel: Kürvorgaben
