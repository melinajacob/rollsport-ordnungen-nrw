  - titel: Formationsrichtlinien
    id: formationen
    kopfzeile: Formation
    neue_seite: true
    bloecke:
      - typ: startbedingungen
        klasse: "Schülerformation"
        alter: "8 – 15 Jahre (2 Läufer:innen dürfen 1 Jahr jünger/älter sein)"
        voraussetzung: "Prüfung A2"
        programm: |
          - **Anzahl Läufer:innen:** 8 – 16
          - **Kürlaufzeit:** 03:30 – 04:00
          - **Gesang:** Ja
          - **Beschränkung:** Sprünge max. 1/2 Umdrehung, Pirouetten max. 1 Umdrehung
          - **Keine Hebungen und akrobatischen Elemente erlaubt**
          - Abzüge bei Regelverstoß: -0,5 A
          - Abzüge fehlende Pflichtelemente: -0,5 A

      - typ: startbedingungen
        klasse: "Juniorenformation"
        alter: "8 – 18 Jahre (2 jünger, 4 bis 2 Jahre älter erlaubt)"
        voraussetzung: "Prüfung A3"
        programm: |
          - **Anzahl Läufer:innen:** 12 – 16
          - **Kürlaufzeit:** 04:00 ± 10 Sek.
          - **Gesang:** Ja
          - **Keine Hebungen und akrobatischen Elemente erlaubt**
          - Weitere Regelungen analog zu Meisterklasse
          - Abzüge bei Regelverstoß: -0,5 A
          - Abzüge fehlende Pflichtelemente: -0,5 A

      - typ: startbedingungen
        klasse: "Meisterklasse Formation"
        alter: "Mindestalter 12 Jahre (2 dürfen 1 Jahr jünger sein)"
        voraussetzung: "Prüfung Kür oder Pflicht 4"
        programm: |
          - **Anzahl Läufer:innen:** 12 – 16
          - **Kürlaufzeit:** 04:30 – 05:00
          - **Gesang:** Ja
          - **Choreografischer Stop:** Max. 10 Sek. erlaubt (weder am Anfang noch am Ende)
          - Sprünge max. 1 Umdrehung
          - Pirouetten max. 3 Umdrehungen
          - Max. 2 kniende/liegende Positionen (max. 5 Sek. am Boden)
          - Akrobatische Elemente: mind. 2 Personen oder Gruppe
          - Eine Hebung darf in den Choreografischen Stop eingebaut werden
          - Abzüge bei Regelverstoß: -0,5 A
          - Abzüge fehlende Pflichtelemente: -0,5 A

      - typ: hinweis
        inhalt: |
          Die Küren dürfen nach verbandsübergreifendem Reglement aufgebaut werden.
          Die Läufer werden dafür nicht bestraft. Die Bewertungsgrundlage für Formation
          ist dem Beiheft "Formation NRW" zu entnehmen.

      - typ: abschnitt
        titel: "Kleiderordnung Formation"
        neue_seite: true
        inhalt: |
          - **Frauen:** Röcke oder Hosen (Leggings nicht erlaubt), Bodys nur zusätzlich mit Rock
          - **Männer:** Hosen, Trikots dürfen nicht ärmellos sein, Dekolleté vollständig bedeckt
          - **Strasssteine:** Ausschließlich bis max. 4 mm empfohlen, Applikationen (z.B. Pailletten) dürfen größer sein
          - **Haar-/Kopfschmuck:** Begrenzt erlaubt, keine Federn, Hüte, Kopftücher oder Masken
          - **Make-up:** Darf nicht übertrieben sein
          - **Requisiten:** Nicht erlaubt. Beleuchtung der Kostüme untersagt.

      - typ: hinweis
        inhalt: |
          Bei Zuwiderhandlung hat der Schiedsrichter vor dem Start einer Formation einzugreifen.
          Falls dies nicht möglich ist oder der Verstoß erst während des Vortrags erkennbar wird,
          weist der Schiedsrichter die Wertungsrichter nach Ende der Vorführung an,
          entsprechende Abzüge vorzunehmen.

      - typ: abschnitt
        titel: "Programm – Zusammenstellung"
        neue_seite: true
        inhalt: |
          1. Vokalmusik ist erlaubt
          2. Ausgeglichenes Programm mit anerkannten Formationselementen (Kreise, Mühlen, Kreuzungen, Blöcke, Linien, Schrittfolgen)
          3. Übergänge zwischen Elementen sollten klar ausgestaltet sein – Verbindungen/Wechsel müssen erkennbar sein
          4. Die Lauffläche sollte maximal ausgenutzt werden
          5. Stillstand während der Kür nicht erlaubt (warten auf Musik), ausgenommen choreografischer Stop (Junioren-/Meisterklasse)
          6. Bewegungen und Schritte müssen im Einklang mit der Musik stehen
          7. Tempowechsel sollen zur Originalität des Programms beitragen

      - typ: abschnitt
        titel: "Bewertung – A-Note"
        neue_seite: true
        inhalt: |
          Note A für den technischen Wert. Bei der Bewertung ist der Schwierigkeitsgrad der Elemente zu bewerten.

          - **Basisnote:** 1,0
          - **Gesamtnote:** 1,0 – 10,0

      - typ: abschnitt
        titel: "Bewertung – B-Note"
        inhalt: |
          Note B für Harmonie und künstlerischen Eindruck der Darbietung.

          - **Grundlage:** A-Note
          - **Abweichung:** ± 1,5

          **Zur Bewertung von Harmonie & künstlerischem Eindruck:**
          1. **Präzision der Elemente** – Formen & Winkel korrekt, Abstände stimmen überein, symmetrische Bilder spiegelgleich
          2. **Gleichmäßigkeit / Synchronität** – Synchroner Ablauf, geschlossenes Erscheinungsbild, gleiche Bewegungen und Körperhaltung
          3. **Geschwindigkeit und Fluss** – Hohe Laufgeschwindigkeit, Abwechslung, flüssige Übergänge
          4. **Originalität** – Abwechslungsreiche Choreografie, Variationen, Laufstil zur Musik
          5. **Platzverteilung** – Nutzung der gesamten Fläche, verschiedene Achsen
          6. **Läuferische Qualität** – Ausgewogener Leistungsstand, Sauberkeit, Einhaltung des Taktes

      - typ: abschnitt
        titel: "Formationselemente – Kreise"
        neue_seite: true
        inhalt: |
          | Stufe | Beschreibung | Punkte | Bewertungskriterien |
          |-------|-------------|--------|---------------------|
          | K1 | Ohne Richtungswechsel & ohne Variation der Kreisgröße | 0,1 – 2,0 | Figur, vw./rw., Armhaltung, einfache Schritte |
          | K2 | Ohne Richtungswechsel mit Variationen in der Größe | 2,1 – 4,2 | Kreis ohne direkte Handhaltung (offener Kreis) + K1 |
          | K3 | Mit Richtungswechsel & Schrittfolgen / Kreuzungen / Wanderung | 4,3 – 6,6 | Schwierigkeit Schritte, Anzahl Personen die kreuzen, Anzahl der RW + K2 |
          | K4 | Mit Schrittelementen & Kreuzungen & wandern | 6,6 – 9,0 | Wanderstrecke + K3 |

      - typ: abschnitt
        titel: "Formationselemente – Mühlen"
        inhalt: |
          | Stufe | Beschreibung | Punkte | Bewertungskriterien |
          |-------|-------------|--------|---------------------|
          | M1 | 2 oder mehr Speichen, ein Drehmittelpunkt | 0,1 – 2,0 | Figur, vw./rw., Armhaltung, einfache Schritte, Umdrehungen |
          | M2 | 2 oder mehr Speichen, mehr als ein Drehpunkt (Doppelmühle / schneidende Mühlen), S-Mühle | 2,1 – 4,2 | Figur, vw./rw., Armhaltung, einfache Schritte, Umdrehungen |
          | M3 | Kombination M1 und M2 oder Mühle mit offener Mitte | 4,3 – 6,6 | Anzahl der Wechsel in der Mühlenart |
          | M4 | M1, M2, M3 plus Wandern | 6,6 – 9,0 | Wanderstrecke + M2/M3 |

      - typ: abschnitt
        titel: "Formationselemente – Blöcke"
        neue_seite: true
        inhalt: |
          | Stufe | Beschreibung | Punkte | Bewertungskriterien |
          |-------|-------------|--------|---------------------|
          | B1 | Angefasst, senkrecht zur Mittelachse mit mind. 2 Reihen | 0,1 – 2,0 | Figur, vw./rw., Armhaltung, einfache Schritte |
          | B2 | Mehrere Achsen diagonal und senkrecht, offener Block ohne erkennbare Schrittelemente | 2,1 – 4,2 | Figur, vw./rw., Armhaltung, einfache Schritte, Anzahl Achsenwechsel, Art Achsenwechsel |
          | B3 | Offen mit Schrittelementen | 4,3 – 6,6 | Schwierigkeit der Schrittelemente, Positionswechsel |
          | B4 | Pivotblock mit Schrittelementen | 6,6 – 9,0 | — |

      - typ: abschnitt
        titel: "Formationselemente – Kreuzungen"
        inhalt: |
          | Stufe | Beschreibung | Punkte | Bewertungskriterien |
          |-------|-------------|--------|---------------------|
          | KG1 | Kreuzungen von mind. 2 Reihen mit einer Kreuzlinie (gerade/diagonal) | 0,1 – 2,0 | Positionswechsel (Bein hoch, tauchen, Hocke, Waage) |
          | KG2 | Kreuzung von mehreren Reihen mit mehreren Kreuzlinien (4eck/3eck) | 2,1 – 4,2 | Schrittelemente, vw./rw. |
          | KG3 | Kreuzung von mehreren Reihen mit diagonaler Kreuzlinie (V-Kreuzung), aufschlagende Kreise die kreuzen | 4,3 – 6,6 | Anzahl der Reihen |
          | KG4 | KG2 oder KG3 mit Schrittelementen, aufschlagende Kreise die kreuzen mit Drehung | 6,6 – 9,0 | Schwierigkeit der Schrittelemente |

      - typ: abschnitt
        titel: "Formationselemente – Linien mit Schrittfolge"
        neue_seite: true
        inhalt: |
          | Stufe | Beschreibung | Punkte | Bewertungskriterien |
          |-------|-------------|--------|---------------------|
          | L1 | Mit Beibehaltung einer Achse, einfache Schritte | 0,1 – 2,0 | Handhaltung, Positionswechsel |
          | L2 | Wechsel Anzahl der Linien mit Beibehaltung einer Achse, einfache Schritte | 2,1 – 4,2 | Handhaltung, Positionswechsel |
          | L3 | Mit Änderung der Achse + Schritte (z.B. Doppeldreier, Mohawk, Choctow, Dreier) | 4,3 – 6,6 | Handhaltung, Positionswechsel |
          | L4 | Mit Änderung der Achse + Schritte (z.B. Wende, Gegenwende, Gegendreier, Drehung 180°, Crossrolls) | 6,6 – 9,0 | Handhaltung, Positionswechsel |

      - typ: abschnitt
        titel: "Weitere Bewertungsmerkmale"
        inhalt: |
          **Schritte:**

          | Stufe | Elemente |
          |-------|----------|
          | S1 | Mohawk, Choctow, Dreier |
          | S2 | S1 + Doppeldreier |
          | S3 | S2 + Wenden, Gegenwenden, Gegendreier |
          | S4 | S2 & S3 + Drehungen 180°, Crossrolls |

          **Handhaltungen:**

          | Stufe | Elemente |
          |-------|----------|
          | H1 | Handgelenk, Hand-in-Hand, Oberarm |
          | H2 | H1 + Arme im Winkel, Arm an Ellbogen |
          | H3 | H2 + Kettengriff, Kreuzgriff |
          | H4 | H1 – H3 + offene Haltung (mind. 3 Sekunden) |

      - typ: abschnitt
        titel: "Abzüge Formation"
        neue_seite: true
        inhalt: |
          **Stürze:**

          | Situation | Abzug |
          |-----------|-------|
          | Kurzer Sturz von einem Läufer | 0,2 |
          | Ein Läufer längere Zeit oder kurzer Sturz mit mehreren Läufern | 0,6 |
          | Mehr als ein Läufer für eine längere Zeit | 0,8 – 1,0 |

          **Programmaufbau:**

          | Situation | Abzug |
          |-----------|-------|
          | Stillstand / Liegen auf der Fläche | 0,2 pro Element |
          | Programm zu lang / zu kurz | 0,2 pro 10 Sekunden |
          | Sprünge mit mehr als einer Drehung | 0,4 |
          | Nicht erlaubte Hebung | 0,4 |

  - titel: Begriffserläuterungen
    id: begriffe
    kopfzeile: Begriffe
    neue_seite: true
    bloecke:
      - typ: abschnitt
        titel: "Begriffe"
        inhalt: |
          | Begriff | Erläuterung |
          |---------|------------|
          | Schrittfolge | Eine Abfolge von reinen Schritten |
          | Choreo-Step Sequenz | Eine Abfolge von Schritten, Figuren oder ein Tanz auf der Stelle |
          | 3 Quadrantenregel | Die Lauffläche wird in vier Quadrate aufgeteilt. Die gelaufene Schrittfolge muss mind. durch 3 dieser Quadrate laufen |
          | Start/Stop Position | Die Schrittfolge soll aus dem Stand begonnen werden und darf in beliebiger Position auslaufen |
          | Figurenserpentine | Die Darbietung einer Figur in einer S-(Schlangen)förmigen Form |

      - typ: abschnitt
        titel: "Merkmale eines Gruppenlaufs"
        neue_seite: true
        inhalt: |
          **Technik:**
          - Alle machen das gleiche Element
          - Synchronität
          - Gruppenelemente
          - Kein lautes Vorzählen

          **Choreo:**
          - Lauffläche muss genutzt werden
          - Richtungswechsel
          - Akrobatisches Element
          - Geschlossenheit
          - Positionsvariationen

          **Wertung:**
          - 3 müssen das Element richtig zeigen, kein Sturz
          - Je enger die Läufer:innen zusammen stehen, desto höher die Wertigkeit
          - Elemente, die nicht von allen Läufer:innen im Sichtfeld der WR gezeigt werden, sind nicht wertbar
          - Vorgeschriebene Elemente müssen beachtet werden

      - typ: abschnitt
        titel: "Pirouetten – Bewertungskriterien"
        inhalt: |
          Eine Pirouette besteht aus den folgenden Merkmalen:

          - **Anlauf** – Vorbereitung der Pirouette
          - **Eingang** – Übergang in die Drehung
          - **Zentrierung** – Stabilität des Drehpunkts
          - **Kante** – Korrekte Kantenführung
          - **Umdrehungen** – Anzahl der vollständigen Drehungen
          - **Wechsel** – Füße werden eng gesetzt, schneller Positionswechsel
          - **Position** – Schnell in neue Position
          - **Auslauf** – Nicht über den Stopper

  - titel: Anfänger Kürpokal
    id: kuerpokal
    kopfzeile: Kürpokal
    neue_seite: true
    bloecke:
      - typ: abschnitt
        titel: "Anfänger Kürpokal"
        inhalt: |
          Der Kürpokal ist ein Wettbewerb für die Anfängerklassen (Anfänger 1 und Anfänger 2).
          Es gibt ausschließlich Einzelwettbewerbe. Die Läufer:innen werden dabei nach Jahrgängen
          eingeteilt und treten gegen gleichaltrige Konkurrent:innen an.

          | | |
          |---|---|
          | Kürlaufzeit | 01:30 – 02:00 |
          | Einlaufzeit | 02:30 |
          | Prüfungen | Keine erforderlich |
          | Kürvorgaben | Keine Beschränkungen (abwechslungsreich, Kombination aus Figuren, Schritten, Sprüngen und Pirouetten) |

      - typ: hinweis
        inhalt: |
          **Startbedingungen:** Alle Läufer:innen, die in der vorherigen Saison **nicht** bei den
          Landesmeisterschaften gestartet sind oder in der Klasse A0 gestartet sind, dürfen teilnehmen.

