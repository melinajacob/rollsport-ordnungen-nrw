  - titel: Wertungsschema Kür
    id: wertungsschema
    kopfzeile: Wertungsschema Kür
    neue_seite: true
    bloecke:
      - typ: abschnitt
        titel: "A-Note (Gedrittelt)"
        inhalt: |
          Die A-Note setzt sich aus drei gleichgewichteten Teilen zusammen:

          | Teil | Anteil |
          |------|--------|
          | Sprünge | 1/3 |
          | Pirouetten | 1/3 |
          | Skating Skills | 1/3 |

      - typ: abschnitt
        titel: "B-Note"
        inhalt: |
          **Spielraum:** -1,5 bis +1,5

          Bewertung der künstlerischen Gestaltung, Ausdruck, Musikinterpretation und Choreografie.

      - typ: abschnitt
        titel: "Regelverstöße"
        kasten: hinweis
        inhalt: |
          | Anzahl Verstöße | Abzug A-Note |
          |-----------------|-------------|
          | 1 Verstoß | -0,5 |
          | 2 Verstöße | -0,7 |
          | 3 Verstöße | -1,0 |

          Regelverstöße sind durch den Schiedsrichter festzustellen.

      - typ: abschnitt
        titel: "Sprünge – Honorierung"
        kasten: hinweis
        inhalt: |
          Zulässig ist eine 1 1/2-facher Sprung (in A Note honoriert):
          - 1 1/2 Runden: +0,1
          - 1 3/4 Runden: +0,2

      - typ: abschnitt
        titel: "Unsportliches Verhalten"
        kasten: hinweis
        inhalt: |
          Entsprechend der Schwere des Verstoßes mit -0,3 bis -1,0 (Abzug in der B Note)

      - typ: hinweis
        inhalt: |
          Wenn einer Kür die Basiselemente fehlen, sie aber ein hohes Element enthält, kann nicht die volle Punktzahl dieses Elements als Basiswert genutzt werden.

      - typ: abschnitt
        titel: "Sprungwertigkeiten"
        neue_seite: true
        inhalt: |
          | Sprung | Wertigkeit |
          |--------|-----------|
          | Alle Figuren (Waage, Pistole, …) | 1,2 |
          | Tippsprung | 1,5 |
          | Drehsprung | 1,6 / 1,7 |
          | Dreiersprung | 1,8 |
          | 3 Dreiersprünge | 2,2 |
          | Toeloop | 2,5 |
          | Salchow | 2,7 |
          | Flip | 2,9 |
          | Lutz | 3,1 |
          | Rittberger | 3,4 |
          | 3 Rittberger | 3,7 |
          | 3/4 Axel | 4,2 |
          | Axel | 4,5 |
          | Doppel-Toeloop (leicht vorgedreht) | 5,2 |
          | Doppel-Salchow | 5,3 |
          | Doppel-Toeloop (nicht vorgedreht) | 5,5 |
          | Doppel-Flip | 6,0 |
          | Doppel-Rittberger | 6,2 |
          | Doppel-Lutz | 6,5 |
          | Doppel-Axel | 8,7 |
          | Dreifach-Toeloop | 9,0 |
          | Dreifach-Salchow | 9,0 |

          Alles, was ein Element offensichtlich erschwert (z.B. Eingang, Arm- oder Körperhaltung, …) erhöht die Wertigkeit um bis zu 0,5 Punkte.

      - typ: abschnitt
        titel: "Sprungkombinationen"
        inhalt: |
          **Doppelsprungkombi (1 Doppelt):**

          | Kombination | Wertigkeit |
          |-------------|-----------|
          | Kombi mit D-Toeloop | 7,0 |
          | Kombi mit D-Salchow | 7,1 – 7,2 |
          | Axel-Doppelsprung Kombi | 7,3 |
          | Kombi mit D-Flip | 7,2 – 7,3 |
          | Kombi mit D-Rittberger | 7,3 – 7,4 |

          **Doppelsprungkombi (2 Doppelt):**

          | Kombination | Wertigkeit |
          |-------------|-----------|
          | Kombi mit mind. 2 D-Toeloop | 7,5 – 7,6 |
          | Kombi mit mind. 1 D-Salchow | 7,6 – 7,7 |
          | Axelkombi mit 2 D-Sprüngen | 7,8 |
          | Kombi mit mind. 1 D-Flip | 7,7 – 7,8 |
          | Kombi mit mind. 1 D-Rittberger | 7,8 |
          | Kombi mit mind. 2 D-Rittberger | 7,9 |

          Der Wert einer Sprungkombination ist höher als der schwierigste, darin enthaltene Sprung. Zuschlag von max. 1,5 Punkten möglich.

          **Sprünge mit 1 1/2 Runden:** +0,1
          **Sprünge mit 1 3/4 Runden:** +0,2

      - typ: abschnitt
        titel: "Pirouettenwertigkeiten"
        inhalt: |
          | Pirouette | Umdrehungen | Wertigkeit | Klasse |
          |-----------|-------------|-----------|--------|
          | Zweibeinpirouette | > 2 | 1,5 | — |
          | Standpirouette ve/re | > 2 | 2,0 | — |
          | Libelle / Standpirouette ra | > 2 | 2,7 | — |
          | Standpirouette auf Hacke | > 2 | 2,9 | — |
          | Sitzpirouette re | mind. 3 | 3,0 (+0,2 ganz unten) | — |
          | Sitzpirouette ra | mind. 3 | 3,3 (+0,2 ganz unten) | — |
          | Tscherkessen-, Sit behind | > 3 | 3,8 | — |
          | Wechselsitz-Pirouette | mind. 2×2 | 4,0 (+0,2 ganz unten) | — |
          | Waage ra o. va | > 2 | 4,5 | C |
          | Sitzpirouette Sideways / Twist | mind. 3 | 4,8 | — |
          | Standpirouette forward | mind. 3 | 5,0 | — |
          | Lay-Back ohne Stopper | mind. 3 | 5,0 | — |
          | Waage ra / re | mind. 3 | 5,0 | B |
          | Waage va | mind. 3 | 5,3 | B |
          | Lay-over | mind. 3 | 5,7 | B |
          | Wechselwaage Kanten-/Fußw. | mind. 3 × 3 | 6,0 | B |
          | Torso sideways | mind. 3 | 6,0 | — |
          | Camel forward Spielb. gehalten | mind. 3 | 6,0 | B |
          | Ein- / umgesprungene Waage | mind. 3 × 3 | 6,2 | B |
          | Split | mind. 3 | 6,5 | — |
          | Camel sideways ("Donut") | mind. 3 | 6,7 | B |
          | Broken Ankle | mind. 3 | 7,3 | A |
          | Hacke ra | mind. 3 | 7,5 | A |
          | Biellmann | > 3 | 7,6 – 7,7 | B |
          | Hacke va | mind. 3 | 7,8 | A |
          | Inverted flach | mind. 3 | 8,2 | A |
          | Bryant | mind. 3 | 8,3 | A |

          Der Wert einer Pirouettenkombination ist höher als der Wert des schwierigsten darin enthaltenen Einzelelements. Zuschlag von max. 1,0 Punkten möglich.

      - typ: abschnitt
        titel: "Skating Skills"
        neue_seite: true
        inhalt: |
          In den Skating Skills werden die läuferischen Fähigkeiten bewertet.

          **Anfänger 0 & Anfänger I** (0,00 – 2,7):
          Abstoßen vorwärts und rückwärts ohne Stopper, Übersetzen rechts und links / vorwärts und rückwärts, Walzer-Dreier, Mohawkschritt, Schwungbögen, Chassé

          **Anfänger II** (0,00 – 3,5):
          Dreier vorwärts oder rückwärts, Doppeldreier rückwärts, Cross Rolls, Loopstep, Travellings (schnelle, kantenlose Dreierdrehungen – mind. 2 ganze Umdr.), Offener und geschlossener Mohawk

          **Fortgeschrittene I & II** (0,00 – 3,8):
          Gegendreier jeder Variante

          **Nachwuchsklasse** (0,00 – 4,5):
          Schlinge auswärts / einwärts bzw. vorwärts/rückwärts, Wende va/ve, Gegenwende va/ve

          **Juniorenklasse** (0,00 – 5,3):
          Kombinationen der vorgenannten Turns

          **Juniorenklasse Elite (A-Schiene)** (0,00 – 5,5):
          Kombinationen der vorgenannten Turns

          **Meisterklasse** (0,00 – 6,5):
          Kombinationen der vorgenannten Turns

          **Meisterklasse Elite (A-Schiene)** (0,00 – 7,5):
          Kombinationen der vorgenannten Turns

          *Die Wertigkeit der gezeigten Skills richtet sich nach der gezeigten Schwierigkeit der Turns und Bodymovements, der Vielfältigkeit und Kreativität.*

  - titel: Übersicht Pirouetten
