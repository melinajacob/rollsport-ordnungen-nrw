  - titel: Wertungsschema Kür
    id: wertungsschema
    kopfzeile: Wertungsschema
    neue_seite: true
    bloecke:
      - typ: abschnitt
        titel: "Wertungshinweise"
        inhalt: |
          **A-Note wird gedrittelt:**
          - Sprünge: 1/3
          - Pirouetten: 1/3
          - Skating Skills: 1/3

          **B-Note:** Spielraum -1,5 bis +1,5

          **Regelverstöße (Abzug in der A-Note):**

          | Anzahl Verstöße | Abzug |
          |-----------------|-------|
          | 1 Verstoß | -0,5 |
          | 2 Verstöße | -0,7 |
          | 3 Verstöße | -1,0 |

          Regelverstöße sind durch den Schiedsrichter festzustellen.

          **Sprünge (in der A-Note honoriert):**
          - 1 1/2 Runden: +0,1
          - 1 3/4 Runden: +0,2

          **Unsportliches Verhalten:** Abzug in der B-Note -0,3 bis -1,0

      - typ: hinweis
        inhalt: |
          Wenn einer Kür die Basiselemente fehlen, sie aber ein hohes Element enthält,
          kann nicht die volle Punktzahl dieses Elements als Basiswert genutzt werden.

      - typ: abschnitt
        titel: "Skating Skills nach Klasse"
        neue_seite: true
        inhalt: |
          | Klasse | Punktebereich | Elemente |
          |--------|--------------|----------|
          | Anfänger 0 & 1 | 0,00 – 2,7 | Abstoßen vw./rw. ohne Stopper, Übersetzen re/li vw./rw., Walzer-Dreier, Mohawkschritt, Schwungbögen, Chassé |
          | Anfänger 2 | 0,00 – 3,5 | Dreier vw. oder rw., Doppeldreier rw., Cross Rolls, Loopstep, Travellings (mind. 2 ganze Umdr.), offener und geschlossener Mohawk |
          | Fortgeschrittene 1 & 2 | 0,00 – 3,8 | Gegendreier jeder Variante |
          | Nachwuchsklasse | 0,00 – 4,5 | Schlinge auswärts/einwärts bzw. vw./rw., Wende va/ve, Gegenwende va/ve |
          | Juniorenklasse | 0,00 – 5,3 | Kombinationen der vorgenannten Turns |
          | Junioren Elite (A-Schiene) | 0,00 – 5,5 | — |
          | Meisterklasse | 0,00 – 6,5 | — |
          | Meisterklasse Elite (A-Schiene) | 0,00 – 7,5 | — |

      - typ: hinweis
        inhalt: |
          Die Wertigkeit der gezeigten Skills richtet sich nach der gezeigten Schwierigkeit
          der Turns und Body Movements, der Vielfältigkeit und Kreativität.

      - typ: abschnitt
        titel: "Sprünge – Wertigkeiten"
        neue_seite: true
        inhalt: |
          | Sprung | Wertigkeit |
          |--------|-----------|
          | Alle Figuren (Waage, Pistole, …) | 1,2 |
          | Tippsprung | 1,5 |
          | Drehsprung | 1,6 / 1,7 |
          | Dreiersprung | 1,8 |
          | 3 Dreiersprünge | 2,2 |
          | Toeloop | 2,5 |
          | Salchow | 2,7 |
          | Flip | 2,9 |
          | Lutz | 3,1 |
          | Rittberger | 3,4 |
          | 3 Rittberger | 3,7 |
          | 3/4 Axel | 4,2 |
          | Axel | 4,5 |
          | Doppel-Toeloop (leicht vorgedreht) | 5,2 |
          | Doppel-Salchow | 5,3 |
          | Doppel-Toeloop (nicht vorgedreht) | 5,5 |
          | Doppel-Flip | 6,0 |
          | Doppel-Rittberger | 6,2 |
          | Doppel-Lutz | 6,5 |
          | Doppel-Axel | 8,7 |

          **Sprungkombinationen (1 Doppelsprung):**

          | Kombination | Wertigkeit |
          |-------------|-----------|
          | Kombi mit D-Toeloop | 7,0 |
          | Kombi mit D-Salchow | 7,1 – 7,2 |
          | Axel-Doppelsprung Kombi | 7,3 |
          | Kombi mit D-Flip | 7,2 – 7,3 |
          | Kombi mit D-Rittberger | 7,3 – 7,4 |

          **Sprungkombinationen (2 Doppelsprünge):**

          | Kombination | Wertigkeit |
          |-------------|-----------|
          | Kombi mit mind. 2 D-Toeloop | 7,5 – 7,6 |
          | Kombi mit mind. 1 D-Salchow | 7,6 – 7,7 |
          | Axelkombi mit 2 D-Sprüngen | 7,8 |
          | Kombi mit mind. 1 D-Flip | 7,7 – 7,8 |
          | Kombi mit mind. 1 D-Rittberger | 7,8 |
          | Kombi mit mind. 2 D-Rittberger | 7,9 |

          **Dreifachsprünge:**

          | Sprung | Wertigkeit |
          |--------|-----------|
          | Dreifach-Toeloop | 9,0 |
          | Dreifach-Salchow | 9,0 |

      - typ: hinweis
        inhalt: |
          Alles was ein Element offensichtlich erschwert (z.B. Eingang, Arm- oder Körperhaltung) erhöht die Wertigkeit
          des Elements um bis zu **0,5 Punkte**. Der Wert einer Sprungkombination ist höher als der schwierigste
          darin enthaltene Sprung. Es ist ein Zuschlag von max. **1,5 Punkten** in Abhängigkeit zu der
          Einzelschwierigkeit der Elemente möglich.

      - typ: abschnitt
        titel: "Pirouetten – Wertigkeiten"
        neue_seite: true
        inhalt: |
          | Pirouette | Umdrehungen | Wertigkeit | Klasse |
          |-----------|-------------|-----------|--------|
          | Zweibeinpirouette | > 2 | 1,5 | — |
          | Standpirouette ve/re | > 2 | 2,0 | — |
          | Libelle / Standpirouette ra | > 2 | 2,7 | — |
          | Standpirouette auf Hacke | > 2 | 2,9 | — |
          | Sitzpirouette re | mind. 3 | 3,0 (+0,2 ganz unten) | — |
          | Sitzpirouette ra | mind. 3 | 3,3 (+0,2 ganz unten) | — |
          | Tscherkessen / Sit behind | > 3 | 3,8 | — |
          | Wechselsitz-Pirouette | mind. 2×2 | 4,0 (+0,2 ganz unten) | — |
          | Waage ra o. va | > 2 | 4,5 | C |
          | Sitzpirouette Sideways / Twist | mind. 3 | 4,8 | — |
          | Standpirouette forward | mind. 3 | 5,0 | — |
          | Lay-Back ohne Stopper | mind. 3 | 5,0 | — |
          | Waage ra/re | mind. 3 | 5,0 | B |
          | Waage va | mind. 3 | 5,3 | B |
          | Lay-over | mind. 3 | 5,7 | B |
          | Wechselwaage Kanten-/Fußw. | mind. 3×3 | 6,0 | B |
          | Torso sideways | mind. 3 | 6,0 | — |
          | Camel forward Spielb. gehalten | mind. 3 | 6,0 | B |
          | Ein-/umgesprungene Waage | mind. 3×3 | 6,2 | B |
          | Split | mind. 3 | 6,5 | — |
          | Camel sideways ("Donut") | mind. 3 | 6,7 | B |
          | Broken Ankle | mind. 3 | 7,3 | A |
          | Hacke ra | mind. 3 | 7,5 | A |
          | Biellmann | > 3 | 7,6 – 7,7 | B |
          | Hacke va | mind. 3 | 7,8 | A |
          | Inverted flach | mind. 3 | 8,2 | A |
          | Bryant | mind. 3 | 8,3 | A |

      - typ: hinweis
        inhalt: |
          Der Wert einer Pirouettenkombination ist höher als der Wert des schwierigsten
          darin enthaltenen Einzelelements. Es ist ein Zuschlag von max. **1,0 Punkten** möglich.

