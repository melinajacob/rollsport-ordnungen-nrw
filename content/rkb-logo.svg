<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Laurel wreath - left branch -->
  <g fill="#4a7c3f" stroke="#3a6830" stroke-width="0.5">
    <ellipse cx="52" cy="145" rx="12" ry="6" transform="rotate(-30 52 145)"/>
    <ellipse cx="40" cy="128" rx="12" ry="6" transform="rotate(-15 40 128)"/>
    <ellipse cx="34" cy="108" rx="11" ry="6" transform="rotate(5 34 108)"/>
    <ellipse cx="35" cy="88" rx="11" ry="6" transform="rotate(20 35 88)"/>
    <ellipse cx="42" cy="70" rx="11" ry="6" transform="rotate(35 42 70)"/>
    <ellipse cx="55" cy="55" rx="10" ry="5.5" transform="rotate(50 55 55)"/>
    <ellipse cx="70" cy="44" rx="10" ry="5" transform="rotate(65 70 44)"/>
  </g>
  <!-- Laurel wreath - right branch -->
  <g fill="#4a7c3f" stroke="#3a6830" stroke-width="0.5">
    <ellipse cx="148" cy="145" rx="12" ry="6" transform="rotate(30 148 145)"/>
    <ellipse cx="160" cy="128" rx="12" ry="6" transform="rotate(15 160 128)"/>
    <ellipse cx="166" cy="108" rx="11" ry="6" transform="rotate(-5 166 108)"/>
    <ellipse cx="165" cy="88" rx="11" ry="6" transform="rotate(-20 165 88)"/>
    <ellipse cx="158" cy="70" rx="11" ry="6" transform="rotate(-35 158 70)"/>
    <ellipse cx="145" cy="55" rx="10" ry="5.5" transform="rotate(-50 145 55)"/>
    <ellipse cx="130" cy="44" rx="10" ry="5" transform="rotate(-65 130 44)"/>
  </g>
  <!-- Laurel stems -->
  <path d="M68 160 Q45 120 70 42" fill="none" stroke="#3a6830" stroke-width="2"/>
  <path d="M132 160 Q155 120 130 42" fill="none" stroke="#3a6830" stroke-width="2"/>
  <!-- Wheel outer ring -->
  <circle cx="100" cy="90" r="45" fill="none" stroke="#1e1e1e" stroke-width="3.5"/>
  <!-- Wheel inner ring -->
  <circle cx="100" cy="90" r="36" fill="none" stroke="#1e1e1e" stroke-width="1.5"/>
  <!-- Wheel hub -->
  <circle cx="100" cy="90" r="8" fill="none" stroke="#1e1e1e" stroke-width="1.5"/>
  <!-- Wheel spokes -->
  <line x1="100" y1="54" x2="100" y2="82" stroke="#1e1e1e" stroke-width="1.5"/>
  <line x1="100" y1="98" x2="100" y2="126" stroke="#1e1e1e" stroke-width="1.5"/>
  <line x1="64" y1="69" x2="92" y2="85" stroke="#1e1e1e" stroke-width="1.5"/>
  <line x1="108" y1="95" x2="136" y2="111" stroke="#1e1e1e" stroke-width="1.5"/>
  <line x1="64" y1="111" x2="92" y2="95" stroke="#1e1e1e" stroke-width="1.5"/>
  <line x1="108" y1="85" x2="136" y2="69" stroke="#1e1e1e" stroke-width="1.5"/>
  <!-- Red stylized S -->
  <path d="M82 60 C82 60 118 52 118 72 C118 86 80 80 80 94 C80 114 120 106 118 120"
        fill="none" stroke="#c8102e" stroke-width="8" stroke-linecap="round"/>
  <!-- R K B letters -->
  <text x="72" y="175" font-family="'Outfit', Arial, sans-serif" font-weight="900" font-size="18" fill="#1e1e1e" text-anchor="middle">R</text>
  <text x="100" y="175" font-family="'Outfit', Arial, sans-serif" font-weight="900" font-size="18" fill="#1e1e1e" text-anchor="middle">K</text>
  <text x="128" y="175" font-family="'Outfit', Arial, sans-serif" font-weight="900" font-size="18" fill="#1e1e1e" text-anchor="middle">B</text>
</svg>
