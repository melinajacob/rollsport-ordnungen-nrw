  - titel: Kürprüfungen
    id: kuerpruefungen
    kopfzeile: Kürprüfungen
    neue_seite: true
    bloecke:
      - typ: pruefung
        name: "Kür 4"
        elemente:
          - Toeloop
          - Salchow
          - Flip
          - Rittberger aus beliebiger Vorbereitung
        elemente_rechts:
          - Dreierschritte in Achterform
          - "Standpirouette re **5 Umdrehungen**"
          - "Sitzpirouette (in Sitzposition) re **3 Umdrehungen**"
          - "Wahlweise Standpirouette va **oder** ra **5/3 Umdrehungen**"
        wertung:
          mindestpunktzahl: "36,0"
          durchschnittswert: "4,5"
          keine_note_unter: "?"
          noten:
            sehr_gut: "6,4"
            gut: "6,0"
            befriedigend: "5,4"
            ausreichend: "4,5"
            mangelhaft: "3,5"

      - typ: pruefung
        name: "Kür 3 - Nachwuchsklasse"
        elemente:
          - "Schrittpassage (wie in der WKO festgelegt)"
          - Lutz
          - "Kombination aus **3 Sprüngen mit Thorén**, nicht am Anfang oder Ende der Kombi"
          - 3 Rittberger in Folge
        elemente_rechts:
          - "Sitzpirouette re **3 Umdrehungen**"
          - "Standpirouette va oder ra **3 Umdrehungen**"
          - "Eingeschleuderte Waagenpirouette re **2 Umdrehungen**"
        wertung:
          mindestpunktzahl: "38,5"
          durchschnittswert: "5,5"
          keine_note_unter: "?"
          noten:
            sehr_gut: "7,4"
            gut: "7,0"
            befriedigend: "6,4"
            ausreichend: "5,5"
            mangelhaft: "4,5"
      - typ: hinweis
        inhalt: |
          Für jedes Kürelement stehen **2 Versuche** zur Verfügung. Der bessere wird gewertet.

      - typ: abschnitt
        titel: "Kür 3 - Schrittfolge"
        neue_seite: true
        inhalt: |
          Kreis-, Diagonal-, Serpentinen- oder Längsschrittfolge mit mindestens folgenden Elementen:

          - 2 Doppeldreier, einer im Uhrzeigersinn, einer gegen den Uhrzeigersinn
          - 2 Gegendreier, einer im Uhrzeigersinn, einer gegen den Uhrzeigersinn
          - 2 verschiedene Elemente aus den Folgenden:
            - 1 Wende
            - 1 Gegenwende
            - 1 Choctaw
            - 1 Schlinge
            - 1 Loopstep
            - Twizzle/Travelling

          verbunden durch weitere Schritte, Drehung und Body Movements

      - typ: pruefung
        name: "Kürklasse 2 - Juniorenklasse"
        neue_seite: true
        elemente:
          - 5 Rittberger in Folge
          - "Kombination aus **4 Sprüngen mit Thorén** (nicht am Anfang oder Ende der Kombi)"
          - Axel
          - "Doppel-Toeloop **oder** Doppel-Salchow"
        elemente_rechts:
          - "Kreisschrittfolge nach beiden Seiten (ohne Figur)"
          - "Eingeschleuderte Waagenpirouette va **2 Umdrehungen**"
          - "Eingeschleuderte Waagenpirouette ra **3 Umdrehungen**"
        wertung:
          mindestpunktzahl: "45,5"
          durchschnittswert: "6,5"
          keine_note_unter: "?"
          noten:
            sehr_gut: "4,0"
            gut: "3,7"
            befriedigend: "3,2"
            ausreichend: "2,5"
            mangelhaft: "1,5"

      - typ: pruefung
        name: "Kür 1"
        elemente:
          - "Schrittverbindung in Serpentinen Form **(mind. 1 1/2 S)** mit schwierigen Elementen (mit Doppeldreier, Gegendreier, Wenden, Gegenwenden, Mohawk, Choctaws, …)"
          - Doppel Toeloop
          - Doppel Salchow
          - "Sprungkombination aus **3 bis 5 Sprüngen, mind. 1 Doppelsprung**"
        elemente_rechts:
          - "Eingeschleuderte Waagenpirouette va **3 Umdrehungen**"
          - "Wechsel - Waage **3/3 Umdrehungen**"
          - "Waage / Sitzpirouette (Kante beliebig) **3/3 Umdrehungen**"
        wertung:
          mindestpunktzahl: "52,5"
          durchschnittswert: "7,5"
          keine_note_unter: "?"
          noten:
            sehr_gut: "4,0"
            gut: "3,7"
            befriedigend: "3,2"
            ausreichend: "2,5"
            mangelhaft: "1,5"
      - typ: hinweis
        inhalt: |
          Für jedes Kürelement stehen **2 Versuche** zur Verfügung. Der bessere wird gewertet.

