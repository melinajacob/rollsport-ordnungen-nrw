titel: Prüfungsordnung
untertitel: Prüfungen Nordrhein-Westfalen
unterzeile: mit Wertungsrichtlinien für Wertungsrichter:innen
saison: "2026"
stand: "02.03.2026"
stand_wr: "02.03.2026"
kapitel:
  - titel: Anfängerprüfungen
    id: anfaengerpruefungen
    kopfzeile: Anfängerprüfungen
    bloecke:
      - typ: pruefung
        name: "A1 - Freiläufer"
        elemente:
          - Rechts & links vorw. übersetzen
          - Rechts & links rückwärts übersetzen
          - "Wahl eines Body Movements (low, medium, high)"
          - Bremsen durch Drehung auf rückwärts und auf die Stopper
        wertung:
          mindestpunktzahl: "6,0"
          durchschnittswert: "1,5"
          keine_note_unter: "1,0"
          noten:
            sehr_gut: "2,5"
            gut: "2,3"
            befriedigend: "2,0"
            ausreichend: "1,5"
            mangelhaft: "1,0"

      - typ: pruefung
        name: "A2 - Figurenläufer"
        elemente:
          - Bogenachter Rva und Lva
          - Fuchsdreier Lva und Rva (mit oder ohne Zeichnung)
          - "Schwungbögen (links und rechts)"
        elemente_rechts:
          - Flieger vorwärts und rückwärts mit Wechsel um die Kurve
          - Dreiersprung mit Mohawkanlauf
          - Salchow mit langem Auslauf
          - "Zweibeinpirouette **oder** Einbeinpirouette 4 oder 3 Umdrehungen"
          - "Zirkel ra **oder** Mond"
        wertung:
          mindestpunktzahl: "20,0"
          durchschnittswert: "2,5"
          keine_note_unter: "1,5"
          noten:
            sehr_gut: "4,0"
            gut: "3,7"
            befriedigend: "3,2"
            ausreichend: "2,5"
            mangelhaft: "1,5"
      - typ: hinweis
        inhalt: |
          Für jedes Kürelement stehen **2 Versuche** zur Verfügung. Der bessere wird gewertet.
      - typ: hinweis
        inhalt: |
          Bei nicht ausreichender Wertung darf **jedes Element** am Ende einer Prüfung
          wiederholt werden!

      - typ: pruefung
        name: "A3 - Kunstläufer"
        elemente:
          - Dreiersprung mit Mohawkanlauf
          - Salchow
          - Rittberger
          - "Zweibeinpirouette mind. **5 Umdrehungen**"
          - "Einbeinpirouette mind. **3 Umdrehungen**"
        wertung:
          mindestpunktzahl: "20,0"
          durchschnittswert: "4,0"
          keine_note_unter: "2,5"
          noten:
            sehr_gut: "6,2"
            gut: "5,7"
            befriedigend: "5,0"
            ausreichend: "4,0"
            mangelhaft: "2,5"
      - typ: hinweis
        inhalt: |
          Für jedes Kürelement stehen **2 Versuche** zur Verfügung. Der bessere wird gewertet.
      - typ: hinweis
        inhalt: |
          Bei nicht ausreichender Wertung darf **jedes Element** am Ende einer Prüfung
          wiederholt werden!

  - titel: Pflichtprüfungen
    id: pflichtpruefungen
    kopfzeile: Pflichtprüfungen
    neue_seite: true
    bloecke:
      - typ: pruefung
        name: "Pflicht 4"
        elemente:
          - Bogenachter Rva
          - Bogenachter Rve
          - Bogenachter Rra
          - Bogenachter Rre
          - Dreier va / re
          - Dreier ve / ra
          - Schlangenbogen Doppeldreier va
        wertung:
          mindestpunktzahl: "31,5"
          durchschnittswert: "4,5"
          keine_note_unter: "?"
          noten:
            sehr_gut: "6,4"
            gut: "6,0"
            befriedigend: "5,4"
            ausreichend: "4,5"
            mangelhaft: "3,5"

      - typ: pruefung
        name: "Pflicht 3"
        elemente:
          - Doppeldreier Rre
          - Gegendreier ve
          - Gegenwende va
          - Gegenwende ve
          - Schlangenbogen - Dreier va
          - Schlinge Rva
          - Schlinge Rve
        wertung:
          mindestpunktzahl: "38,5"
          durchschnittswert: "5,5"
          keine_note_unter: "?"
          noten:
            sehr_gut: "7,4"
            gut: "7,0"
            befriedigend: "6,4"
            ausreichend: "5,5"
            mangelhaft: "4,5"

      - typ: pruefung
        name: "Pflicht 2"
        elemente:
          - Gegendreier va
          - Wende va
          - Wende ve
          - Schlangenbogen - Doppeldreier ra
          - Gegenwende ve
          - Schlinge Rra
          - Schlinge Rre
          - Schlangenbogen-Schlinge va
        wertung:
          mindestpunktzahl: "52,0"
          durchschnittswert: "6,5"
          keine_note_unter: "?"
          noten:
            sehr_gut: "?"
            gut: "?"
            befriedigend: "?"
            ausreichend: "?"
            mangelhaft: "?"

      - typ: pruefung
        name: "Pflicht 1"
        elemente:
          - Doppeldreier Paragraph va
          - Doppeldreier Paragraph ra
          - Gegendreier Paragraph va
          - Gegendreier Paragraph ra
          - Schlangenbogen - Schlinge ra
          - Schlingen Paragraph va
          - Schlingen Paragraph ra
        wertung:
          mindestpunktzahl: "52,5"
          durchschnittswert: "7,5"
          keine_note_unter: "?"
          noten:
            sehr_gut: "?"
            gut: "?"
            befriedigend: "?"
            ausreichend: "?"
            mangelhaft: "?"

